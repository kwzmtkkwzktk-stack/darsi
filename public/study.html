<style>

:root{
  --bg:#f7f4ff;
  --card:#ffffff;
  --glass:#ffffff;
  --tx:#2a2140;
  --mut:#8b839c;
  --pri:#7c3aed;
  --pri2:#f0e9ff;
  --accent:#ec4899;
  --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 100%);
  --grad2:linear-gradient(135deg,#7c3aed 0%,#db2777 100%);
  --red:#e11d48;
  --bd:#ebe4f7;
  --shadow:0 4px 14px rgba(42,33,64,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120f1c;--card:#1c1730;--glass:#1c1730;--tx:#f3eefc;--mut:#a89bbf;--pri:#c4b5fd;--pri2:#2a2148;--bd:#322a4d;--shadow:0 4px 14px rgba(0,0,0,.25)
}}
:root[data-theme="dark"]{
  --bg:#120f1c;--card:#1c1730;--glass:#1c1730;--tx:#f3eefc;--mut:#a89bbf;--pri:#c4b5fd;--pri2:#2a2148;--bd:#322a4d;--shadow:0 4px 14px rgba(0,0,0,.25)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;background-image:url('/bg-study.jpg');background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:scroll}
@media (min-width:768px){body{background-attachment:fixed}}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.v,#app,#b-paper{width:100%;max-width:100%;box-sizing:border-box;overflow-x:hidden}
img,video,iframe{max-width:100%}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:21px;margin:26px 0 14px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin:2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 18px}
.top select{width:auto;max-width:56%;font-size:13px;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--glass);border:1px solid var(--bd);border-radius:24px;padding:20px 8px 16px;text-align:center;color:var(--tx);font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.97)}
.ic{width:58px;height:58px;border-radius:19px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}.ic svg{width:26px;height:26px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:16px 4px 12px;text-align:center;box-shadow:var(--shadow)}
.st em{display:block;font-style:normal;height:22px}.st em svg{width:22px;height:22px;fill:currentColor}#e1{color:#7c3aed}#e2{color:#ec4899}#e3{color:#a855f7}
.st b{display:block;font-size:30px;margin:6px 0 2px;font-weight:800}
.st span{font-size:12px;color:var(--mut)}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#7c3aed,#1b4a8f);color:#fff;border:0}
.hero h2{margin:0 0 4px}.hero p{margin:0;color:#dbe8fb}.hero a{color:#fff}
select,input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--grad2);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(124,58,237,.22)}
button.ghost{background:var(--pri2);color:var(--pri);box-shadow:none}
button.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.back{background:var(--card);color:var(--tx);width:42px;height:42px;padding:0;font-size:20px;border:1px solid var(--bd)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border:0}
.badge{background:var(--pri2);color:var(--pri);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.bar2{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--grad2)}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--pri2);color:var(--pri)}.seg button.on{background:var(--pri);color:#fff}
.ring{position:relative;width:220px;height:220px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;direction:ltr}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}th,td{border:1px solid var(--bd);padding:8px 4px;text-align:center}th{background:var(--pri2);color:var(--pri)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;color:var(--tx);font-weight:700;font-size:16px;margin-bottom:10px;text-align:right}.qa{margin-top:10px;padding:10px 12px;background:var(--pri2);border-radius:12px;line-height:1.8;font-size:15px}.qa b{color:var(--pri)}
.ch{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:500;font-size:15px;line-height:1.7}.ch.good{background:rgba(46,158,91,.16);border-color:#2e9e5b}.ch.bad{background:rgba(214,69,69,.14);border-color:#d64545}.msg{margin-top:10px;font-size:14px;font-weight:700}
.hide{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--glass);;border-top:1px solid rgba(255,255,255,.5);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 24px rgba(124,58,237,.08)}
nav button{flex:1;background:none;color:var(--mut);padding:8px 0;font-size:12px;border-radius:12px}
nav button i{display:block;margin:0 auto 2px;width:22px;height:22px;font-style:normal}nav button svg{width:22px;height:22px;fill:currentColor}nav button.on{color:var(--pri);background:var(--pri2);border-radius:14px}

input[type=number],input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;min-height:140px;line-height:1.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fi{display:flex;gap:12px;align-items:center}
.ic2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ic2 svg{width:22px;height:22px;fill:currentColor}
.fi .t{flex:1;min-width:0}.fi .t b{display:block;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:10px}.acts a{flex:1}
a.btn{display:block;text-align:center;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none}
a.btn.g{background:var(--pri2);color:var(--pri)}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}.ov.on{display:flex}
.sheet{background:var(--card);border-radius:22px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:14px}
.sheet iframe,.sheet video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;display:block;margin-bottom:10px}
.news img{width:100%;border-radius:14px;margin-top:8px;display:block}
.vid{cursor:pointer}.cover{width:100%;aspect-ratio:16/9;border-radius:14px;margin-bottom:10px;background:linear-gradient(135deg,#f0e9ff,#fce7f3);display:grid;place-items:center;overflow:hidden;color:#7c3aed}.cover img{width:100%;height:100%;object-fit:cover}.cover svg{width:44px;height:44px;fill:currentColor}
.site{font-size:13px;color:var(--pri);font-weight:700;text-decoration:none}.hero-banner{background:var(--grad);color:#fff;border:0;border-radius:24px;padding:20px 18px;margin-bottom:16px;box-shadow:0 12px 32px rgba(124,58,237,.25)}.hero-banner h1,.hero-banner b{color:#fff}.hero-banner .sub{color:rgba(255,255,255,.9)}
.lb{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;line-height:1.7}.chk input{width:20px;height:20px;accent-color:var(--pri);flex:0 0 auto}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:right;padding:16px 18px;background:var(--grad2);color:#fff;border:0;box-shadow:0 10px 28px rgba(124,58,237,.28)}
.tile.wide .ic{margin:0;flex:0 0 auto}.tile.wide b{display:block;font-size:18px}.tile.wide small{display:block;font-weight:500;font-size:13px;opacity:.92;margin-top:2px}
.bub{display:flex;gap:10px;align-items:flex-start;background:var(--pri2);border-radius:18px;padding:14px;margin-bottom:12px;line-height:1.9}
.bot{font-size:30px;flex:0 0 auto}.bot.say{animation:pl .8s infinite}
.mic{width:84px;height:84px;border-radius:50%;font-size:34px;padding:0;background:var(--grad2);color:#fff;border:0;box-shadow:0 8px 24px rgba(236,72,153,.35)}.mic.on{background:#d64545;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
.rs.ok{border-color:#2e9e5b;background:rgba(46,158,91,.12)}.rs.mid{border-color:#e8a31c;background:rgba(232,163,28,.14)}.rs.bad{border-color:#d64545;background:rgba(214,69,69,.1)}
.ans{padding:8px 10px;border-radius:10px;background:var(--card);margin:4px 0 8px;line-height:1.9}
.law3d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.law3d-mini{border-radius:16px;padding:12px;background:var(--glass);border:1px solid var(--bd);text-align:center;cursor:pointer;transition:.2s}
.law3d-mini:active{transform:scale(.97)}
.law3d-mini.on{border-color:var(--pri);box-shadow:0 0 0 2px rgba(124,58,237,.25)}
/* Alien hologram chamber – embedded inside the existing Laws 3D section */
#b-law3d .holo-shell{--hc:#68f7ff;--hm:#8ba4ff;position:relative;isolation:isolate;overflow:hidden;padding:14px;border-radius:28px;color:#e8fdff;background:radial-gradient(ellipse at 50% 32%,#123b62 0%,#08192f 42%,#040914 100%);border:1px solid rgba(104,247,255,.35);box-shadow:0 22px 60px rgba(0,0,0,.35),inset 0 0 35px rgba(57,216,255,.08)}
#b-law3d .holo-shell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.65;background-image:radial-gradient(2px 2px at 12% 18%,#fff 40%,transparent 70%),radial-gradient(1.5px 1.5px at 78% 22%,#9ff 40%,transparent 70%),radial-gradient(2px 2px at 88% 68%,#fff 40%,transparent 70%),radial-gradient(1px 1px at 32% 76%,#9ff 40%,transparent 70%),radial-gradient(1px 1px at 56% 11%,#fff 40%,transparent 70%),radial-gradient(1px 1px at 21% 54%,#8cf 40%,transparent 70%);background-size:230px 180px}
.holo-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.holo-kicker{font:700 10px/1.5 monospace;letter-spacing:1.5px;color:#8befff;text-transform:uppercase}.holo-back{padding:8px 12px;border:1px solid rgba(120,240,255,.28);background:rgba(8,35,56,.75);box-shadow:none;color:#dffcff;border-radius:12px;font-size:13px}
.holo-title{font-size:18px;font-weight:800;line-height:1.6;margin:0 0 2px;color:#fff}.holo-meta{font-size:12px;color:#9ccbdc;margin-bottom:10px}
.holo-stage{height:clamp(285px,78vw,410px);max-height:430px;position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(88,227,255,.25);background:radial-gradient(ellipse at 50% 48%,rgba(25,128,177,.2),transparent 52%),linear-gradient(180deg,rgba(3,15,31,.1),rgba(1,7,18,.7));perspective:1100px;touch-action:pan-y;user-select:none}
.holo-stage:after{content:"";position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;background:linear-gradient(180deg,rgba(80,239,255,.08),transparent);animation:holoScan 4s linear infinite}
.holo-stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 24%,#fff 50%,transparent 70%),radial-gradient(2px 2px at 72% 33%,#b7fbff 50%,transparent 70%),radial-gradient(1px 1px at 85% 76%,#fff 50%,transparent 70%),radial-gradient(1px 1px at 36% 82%,#fff 50%,transparent 70%);background-size:170px 150px;opacity:.7}
.holo-floor{position:absolute;left:-25%;right:-25%;height:48%;bottom:-18%;transform:perspective(280px) rotateX(62deg);transform-origin:top center;background-image:linear-gradient(rgba(70,225,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(70,225,255,.18) 1px,transparent 1px);background-size:32px 28px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),transparent)}
.holo-ring{position:absolute;left:50%;top:48%;width:min(74%,300px);height:85px;border:1px solid rgba(98,241,255,.48);border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-18deg);box-shadow:0 0 17px rgba(39,217,255,.14),inset 0 0 15px rgba(39,217,255,.12);animation:holoOrbit 12s linear infinite}
.holo-ring.r2{width:min(90%,355px);height:125px;border-color:rgba(142,152,255,.3);transform:translate(-50%,-50%) rotateX(68deg) rotateZ(48deg);animation-duration:17s;animation-direction:reverse}
.holo-beam{position:absolute;left:50%;top:51%;width:2px;height:43%;transform:translate(-50%,-50%);background:linear-gradient(transparent,rgba(90,245,255,.6),transparent);filter:blur(2px);opacity:.6}
.holo-core{position:absolute;left:50%;top:44%;width:88%;min-height:100px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%) rotateX(-12deg) rotateY(-18deg) scale(1);transform-style:preserve-3d;cursor:grab;touch-action:none;outline:none}
.holo-core:active{cursor:grabbing}
.holo-formula-wrap{position:relative;max-width:100%;padding:18px 14px;text-align:center;transform:translateZ(35px);transform-style:preserve-3d}
.holo-formula{position:relative;display:inline-block;max-width:100%;font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:clamp(22px,6.6vw,43px);line-height:1.35;letter-spacing:.015em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;color:#e9ffff;text-shadow:0 0 5px #fff,0 0 12px #6df8ff,0 0 28px #00cfff,0 0 55px rgba(0,198,255,.8)}
.holo-formula .depth{position:absolute;inset:0;color:rgba(53,226,255,.7);pointer-events:none;text-shadow:0 0 10px #00cfff}.holo-formula .d1{transform:translateZ(-4px) translateY(1px);opacity:.8}.holo-formula .d2{transform:translateZ(-8px) translateY(2px);opacity:.6}.holo-formula .d3{transform:translateZ(-12px) translateY(3px);opacity:.42}.holo-formula .d4{transform:translateZ(-16px) translateY(4px);opacity:.25}
.holo-lawlabel{margin-top:13px;font-size:12px;color:#a6f7ff;text-shadow:0 0 12px #00bde8;letter-spacing:1px}
.holo-hud{position:absolute;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(104,247,255,.2);border-radius:10px;background:rgba(2,17,34,.55);backdrop-filter:blur(8px);font:10px monospace;color:#9ef6ff}
.holo-hud.h1{top:10px;left:10px}.holo-hud.h2{top:10px;right:10px}.holo-hud.h3{bottom:10px;left:10px}.holo-dot{width:6px;height:6px;border-radius:50%;background:#6bffdc;box-shadow:0 0 10px #6bffdc;display:inline-block}
.holo-hint{position:absolute;bottom:10px;right:10px;color:#8bbacb;font-size:10px;z-index:2}
.holo-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.holo-controls button{min-width:0;padding:10px 5px;border-radius:13px;font-size:12px;background:linear-gradient(135deg,#0b6b91,#174d81);border:1px solid rgba(104,247,255,.25);color:#e8fdff;box-shadow:0 5px 15px rgba(0,190,255,.12)}.holo-controls button.ghost{background:rgba(7,30,52,.85);color:#9ff4ff}.holo-controls button:active{transform:scale(.97)}
.holo-zoomrow{display:flex;align-items:center;gap:10px;margin-top:10px;color:#9ccbdc;font-size:12px}.holo-zoomrow input{flex:1;min-width:0;accent-color:#4beaff}
.holo-info{margin-top:12px;padding:14px;border-radius:16px;border:1px solid rgba(104,247,255,.22);background:rgba(4,25,46,.78);color:#dcfaff;line-height:1.9}.holo-info[hidden]{display:none}.holo-info b{color:#78f5ff}.holo-collect{margin-top:10px;width:100%;background:linear-gradient(120deg,#087eaa,#4c54ba);border:1px solid rgba(140,245,255,.3)}.holo-footnote{text-align:center;color:#6f9bac;font-size:10px;margin-top:10px}
@keyframes holoOrbit{to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(342deg)}}
@keyframes holoScan{0%{transform:translateY(-110%)}100%{transform:translateY(260%)}}
@media(prefers-reduced-motion:reduce){.holo-ring,.holo-stage:after{animation:none}}
@media(max-width:360px){.holo-controls{gap:5px}.holo-controls button{font-size:11px;padding:9px 3px}.holo-stage{height:300px}}
.wheel-box{position:relative;width:min(280px,78vw);height:min(280px,78vw);margin:18px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid #7c3aed;background:conic-gradient(#a855f7 0 25%,#ec4899 0 50%,#f59e0b 0 75%,#3b82f6 0 100%);box-shadow:0 10px 30px rgba(124,58,237,.25);transition:transform 4s cubic-bezier(.12,.75,.08,1)}
.wheel-ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #e11d48;z-index:2}
.wheel-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wheel-lab span{background:rgba(255,255,255,.95);color:#2a2140;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;border:1px solid var(--bd)}
.pq{content-visibility:auto;contain-intrinsic-size:80px;display:flex;gap:10px;align-items:flex-start;width:100%;max-width:100%;box-sizing:border-box;margin:0 0 12px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--bd);box-shadow:0 4px 14px rgba(42,33,64,.06)}
.pq .n{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:10px;background:var(--grad2);color:#fff;font-size:13px;font-weight:800}
.pq .qt{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;line-height:1.85;overflow-wrap:anywhere;word-break:break-word;white-space:normal;color:var(--tx)}
#b-paper,#b-paper .card{width:100%;max-width:100%;box-sizing:border-box;overflow-x:hidden}

mark{background:#ffe08a;color:#1c1c1c;border-radius:4px;padding:0 3px}

/* ===== Live holographic teacher scene: large tutor + real dynamic board ===== */
.exp-live-classroom{position:relative;display:block;min-height:510px;overflow:hidden;direction:ltr;background:#061426 url('/exp-hologram-scene.jpg') center 37%/cover no-repeat;}

        subject:String(it.subject||""),chapter:String(it.chapter||""),
        source:source||"quiz",wrongAt:now,nextAt:now,level:0,times:0
      });

  });

function markReviewResult(id,ok){

function weekStats(){

  });

    if(!best||s.avg>best.avg)best=s;

  });
  var due=dueReviews().length;

function compressImage(file,maxSide,maxBytes){
  maxSide=maxSide||1600;maxBytes=maxBytes||900000;
  return new Promise(function(ok,fail){
    var reader=new FileReader();
    reader.onerror=function(){fail(new Error("تعذر قراءة الصورة"))};
    reader.onload=function(){
      var im=new Image();
      im.onerror=function(){fail(new Error("صورة غير صالحة"))};
      im.onload=function(){
        var s=Math.min(1,maxSide/Math.max(im.width,im.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*s));
        c.height=Math.max(1,Math.round(im.height*s));
        var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
        var q=.82,d=c.toDataURL("image/jpeg",q);
        while(d.length>maxBytes&&q>0.35){q-=0.08;d=c.toDataURL("image/jpeg",q)}
        ok(d);
      };
      im.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function embed(u){
  var m;
  // يوتيوب: خطأ 153 ينحل غالباً بـ referrer صحيح + youtube.com بدل nocookie أحياناً
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)||u.match(/youtu\.be\/([\w-]{11})/))
    return{t:"i",s:"https://www.youtube.com/embed/"+m[1]+"?rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&controls=1&disablekb=0&fs=1"};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{t:"i",s:"https://drive.google.com/file/d/"+m[1]+"/preview"};
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:"v",s:u};
  return{t:"a",s:u};
}

var QZ={qs:null,sub:null,ch:null,i:0,sc:0,wrong:[],_logged:false};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
async function rQuiz(){

function drawQuiz(){
  var b=$("#b-quiz"),h="",qs=QZ.qs;$("#t-quiz").textContent=QZ.ch||QZ.sub||"امتحاناتي";
  if(!QZ.sub){

  }else if(!QZ.ch){
    var chs=[];qs.forEach(function(q){if(q.subject===QZ.sub&&chs.indexOf(q.chapter)<0)chs.push(q.chapter)});
    h=chs.length?chs.map(function(c,i){var n=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===c}).length;return '<button class="opt" data-c="'+i+'"><span>'+esc(c)+'</span><span class="sub">'+ar(n)+" أسئلة ‹</span></button>"}).join(""):'<div class="card">لا توجد أسئلة لهذه المادة بعد.</div>';
    QZ.chs=chs;
  }else{
    var l=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===QZ.ch});
    if(QZ.i>=l.length){
      var pc=Math.round(QZ.sc/l.length*100);
      if(!QZ._logged){
        QZ._logged=true;
        logActivity("quiz",QZ.sub,QZ.sc,l.length,QZ.ch||"");
        if(QZ.wrong&&QZ.wrong.length)addReviewItems(QZ.wrong,"quiz");
      }
      h='<div class="card" style="text-align:center"><div style="font-size:44px">'+(pc>=50?"🎉":"💪")+'</div><b style="font-size:22px">نتيجتك: '+QZ.sc+" من "+l.length+'</b><div class="sub" style="margin:6px 0 16px">'+pc+'%</div><div class="row"><button id="again">إعادة الأسئلة</button><button class="ghost" id="toCh">الفصول</button></div></div>';
    }else{

      h='<div class="sub" style="margin-bottom:6px">السؤال '+(QZ.i+1)+" من "+l.length+'</div><div class="bar2"><i style="width:'+Math.round(QZ.i/l.length*100)+'%"></i></div><div class="card q"><b>'+esc(x.q)+"</b>"+shuf([[x.a,1]].concat(x.o.map(function(o){return[o,0]}))).map(function(c){return '<button class="ch" data-ok="'+c[1]+'">'+esc(c[0])+"</button>"}).join("")+'<div class="msg"></div></div><button id="nx" class="hide" style="width:100%;margin-top:4px">'+(QZ.i===l.length-1?"عرض النتيجة":"السؤال التالي")+"</button>";
    }
  }
  b.innerHTML=h;
  b.querySelectorAll("[data-s]").forEach(function(e){e.onclick=function(){QZ.sub=subs()[+e.dataset.s];QZ.ch=null;drawQuiz();window.scrollTo(0,0)}});
  b.querySelectorAll("[data-c]").forEach(function(e){e.onclick=function(){QZ.ch=QZ.chs[+e.dataset.c];QZ.i=0;QZ.sc=0;QZ.wrong=[];drawQuiz();window.scrollTo(0,0)}});
  var q=b.querySelector(".q");
  if(q)q.querySelectorAll(".ch").forEach(function(c){c.onclick=function(){
    if(q.classList.contains("done"))return;q.classList.add("done");
    var ok=c.dataset.ok==="1";if(ok)QZ.sc++;
    if(!ok){
      if(!QZ.wrong)QZ.wrong=[];
      var cur=l[QZ.i];
      if(cur)QZ.wrong.push({q:cur.q,a:cur.a,subject:cur.subject||QZ.sub,chapter:cur.chapter||QZ.ch});
    }
    q.querySelectorAll(".ch").forEach(function(d){if(d.dataset.ok==="1")d.classList.add("good")});
    if(!ok)c.classList.add("bad");

    $("#nx").classList.remove("hide");
  }});
  var nx=$("#nx");if(nx)nx.onclick=function(){QZ.i++;QZ.keep=true;drawQuiz();window.scrollTo(0,0)};
  var ag=$("#again");if(ag)ag.onclick=function(){QZ.i=0;QZ.sc=0;QZ.wrong=[];QZ._logged=false;drawQuiz()};
  var tc=$("#toCh");if(tc)tc.onclick=function(){QZ.ch=null;drawQuiz()};
}

/* الامتحانات الورقية — أسئلة من الأدمن + تصحيح بالصورة */
var PAPER = { step: "pick", subject: "", questions: [], result: null, busy: false, lastKey: "" };
function paperKey(){return "paperRes:"+(S.grade||"")+"|"+(PAPER.subject||"")}
function savePaperRes(){
  try{
    if(PAPER.result){
      localStorage.setItem(paperKey(), JSON.stringify({
        subject: PAPER.subject,
        questions: PAPER.questions,
        result: PAPER.result,
        at: Date.now()
      }));
      // آخر نتيجة عامة للرجوع لها
      localStorage.setItem("paperLast", JSON.stringify({
        grade: S.grade,
        subject: PAPER.subject,
        questions: PAPER.questions,
        result: PAPER.result,
        at: Date.now()
      }));
    }
  }catch(e){}
}
function loadPaperRes(subject){
  try{
    var raw=localStorage.getItem("paperRes:"+(S.grade||"")+"|"+(subject||""));
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null}
}

async function rPaper() {
  var b = $("#b-paper");
  PAPER.busy = false;
  // إذا رجع من الرئيسية وفيه نتيجة محفوظة لنفس الجلسة
  if (PAPER.step === "result" && PAPER.result) {
    drawPaperResult();
    return;
  }
  if (PAPER.step === "pick" || !PAPER.subject) {
    drawPaperPick();
  } else if (PAPER.step === "exam") {
    drawPaperExam();
  } else if (PAPER.step === "result") {
    drawPaperResult();
  }
}

function drawPaperPick() {
  var b = $("#b-paper");
  var list = subs();
  var h = '<div class="card" style="margin-bottom:14px"><b>📝 الامتحانات الورقية</b><p class="sub" style="line-height:1.8;margin:8px 0 0">اختر المادة، تظهر لك الأسئلة اللي حضّرها المعلم. حلّها على ورقة، صوّر الورقة، وارفع الصورة ليصحّحها الذكاء الاصطناعي (يحلل الورقة سؤالاً بسؤال).</p></div>';
  try{
    var last=JSON.parse(localStorage.getItem("paperLast")||"null");
    if(last&&last.result&&last.grade===S.grade){
      h += '<div class="card" style="margin-bottom:12px"><b>آخر نتيجة محفوظة</b><div class="sub" style="margin:6px 0 10px">'+esc(last.subject||"")+' · '+ar(last.result.score||0)+' من '+ar(last.result.total||0)+' ('+ar(last.result.percent||0)+'%)</div><button id="pLast" style="width:100%">عرض النتيجة السابقة</button></div>';
    }
  }catch(e){}
  if (!list.length) {
    h += '<div class="card">اختر صفّك أولاً من الصفحة الرئيسية.</div>';
  } else {
    h += list.map(function(s, i) {
      var prev=loadPaperRes(s);
      var tag=prev&&prev.result?(' · آخر درجة '+ar(prev.result.score)+'/'+ar(prev.result.total)):"";
      return '<button class="opt" data-s="' + i + '"><span>' + esc(s) + tag + '</span><span class="sub">‹</span></button>';
    }).join("");
  }
  b.innerHTML = h;
  var pl=$("#pLast");
  if(pl)pl.onclick=function(){
    try{
      var last=JSON.parse(localStorage.getItem("paperLast")||"null");
      if(!last||!last.result)return;
      PAPER.subject=last.subject||"";
      PAPER.questions=last.questions||[];
      PAPER.result=last.result;
      PAPER.step="result";
      drawPaperResult();
    }catch(e){}
  };
  b.querySelectorAll("[data-s]").forEach(function(btn) {
    btn.onclick = async function() {
      if (PAPER.busy) return;
      PAPER.busy = true;
      PAPER.subject = list[+btn.dataset.s];
      PAPER.questions = [];
      PAPER.result = null;
      loading(b);
      try {
        var r = await jpost("paper/generate", { grade: S.grade, subject: PAPER.subject });
        PAPER.questions = r.questions || [];
        PAPER.step = "exam";
        drawPaperExam();
      } catch (e) {
        PAPER.busy = false;
        PAPER.step = "pick";
        b.innerHTML = '<div class="card" style="text-align:center">لا يوجد امتحان لهذه المادة حالياً.<br><span class="sub">المعلم لم يضف أسئلة بعد، أو تأكد من الإنترنت وحاول مرة ثانية.</span><br><button id="rt" style="margin-top:12px">حاول مرة ثانية</button></div>';
        $("#rt").onclick = function() { PAPER.step = "pick"; rPaper(); };
      }
    };
  });
}

function drawPaperExam() {
  PAPER.busy = false;
  var b = $("#b-paper");
  var qs = (PAPER.questions || []).map(function(q){

  h += '<div class="card" style="margin-bottom:14px"><b style="font-size:17px">📋 الأسئلة</b>';

    h += '<p class="sub" style="margin-top:10px">ماكو أسئلة ظاهرة لهذا الامتحان.</p>';
  }else{
    h += '<div style="margin-top:12px">';
    qs.forEach(function(q, i) {
      h += '<div class="pq"><span class="n">' + ar(i + 1) + '</span><span class="qt">' + esc(q) + '</span></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card"><b>📤 رفع صور الإجابة</b><p class="sub" style="line-height:1.8;margin:8px 0 12px">اضغط «تصوير» أو «من المعرض» لإضافة صورة. كرر العملية لأي عدد من الصور (حتى 5)، وبعدين اضغط تصحيح.</p>';
  h += '<div class="row" style="gap:8px;margin-bottom:10px">';
  h += '<label for="pCam" id="pCamLab" style="flex:1;display:block;text-align:center;background:var(--pri);color:#fff;border-radius:14px;padding:12px 10px;font-weight:800;cursor:pointer">📷 تصوير</label>';
  h += '<label for="pGal" id="pGalLab" style="flex:1;display:block;text-align:center;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 10px;font-weight:800;cursor:pointer">🖼️ من المعرض</label>';
  h += '</div>';
  h += '<input type="file" id="pCam" accept="image/*" capture="environment" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">';
  h += '<input type="file" id="pGal" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">';
  h += '<div id="pPrev" class="hide" style="margin-bottom:12px"></div>';
  h += '<button id="pGrade" style="width:100%" disabled>صحّح الامتحان بالذكاء الاصطناعي</button>';
  h += '<button class="ghost" id="pBack" style="width:100%;margin-top:8px">رجوع واختيار مادة ثانية</button>';

  b.innerHTML = h;

  var camInput = $("#pCam");
  var galInput = $("#pGal");
  var gradeBtn = $("#pGrade");
  var preview = $("#pPrev");
  var selectedImages = [];

  function setLabs(){
    var full = selectedImages.length >= 5;
    var camLab = $("#pCamLab");
    var galLab = $("#pGalLab");
    if (camLab) {
      camLab.style.opacity = full ? ".5" : "1";
      camLab.textContent = full ? "تم حد 5 صور" : "📷 تصوير";
    }
    if (galLab) {
      galLab.style.opacity = full ? ".5" : "1";
      galLab.textContent = full ? "تم حد 5 صور" : "🖼️ من المعرض";
    }
  }

  function refreshPrev(){
    if (!selectedImages.length) {
      preview.classList.add("hide");
      preview.innerHTML = "";
      gradeBtn.disabled = true;
      gradeBtn.textContent = "صحّح الامتحان بالذكاء الاصطناعي";
      setLabs();
      return;
    }
    preview.classList.remove("hide");
    preview.innerHTML = selectedImages.map(function(src, i){
      return '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;background:rgba(0,0,0,.04);border-radius:12px;padding:8px">'+
        '<img src="'+src+'" alt="صورة '+(i+1)+'" style="width:72px;height:72px;object-fit:cover;border-radius:10px;background:#eee">'+
        '<div style="flex:1"><b>صورة '+(i+1)+'</b><div class="sub">جاهزة للتصحيح</div></div>'+
        '<button type="button" class="ghost sm" data-rm="'+i+'" style="padding:8px 12px">حذف</button></div>';
    }).join("");
    preview.querySelectorAll("[data-rm]").forEach(function(btn){
      btn.onclick = function(){
        selectedImages.splice(+btn.dataset.rm, 1);
        refreshPrev();
      };
    });
    gradeBtn.disabled = PAPER.busy;
    gradeBtn.textContent = "صحّح الامتحان بالذكاء الاصطناعي (" + selectedImages.length + " صورة)";
    setLabs();
  }

  async function addFile(f){
    if (!f) return;
    if (!/^image\//.test(f.type || "")) {
      alert("اختر صورة فقط");
      return;
    }
    if (selectedImages.length >= 5) {
      alert("الحد الأقصى 5 صور");
      return;
    }
    gradeBtn.disabled = true;
    gradeBtn.textContent = "جاري تجهيز الصورة...";
    try {
      var dataUrl = await compressImage(f, 1400, 700000);
      selectedImages.push(dataUrl);
      refreshPrev();
    } catch (e) {
      alert("تعذر تجهيز الصورة، جرّب مرة ثانية");
      refreshPrev();
    }
  }

  camInput.onchange = function(){
    var f = camInput.files && camInput.files[0];
    camInput.value = "";
    addFile(f);
  };
  galInput.onchange = function(){
    var f = galInput.files && galInput.files[0];
    galInput.value = "";
    addFile(f);
  };

  // منع فتح الكاميرا إذا وصلنا للحد
  function guard(e){
    if (selectedImages.length >= 5) {
      e.preventDefault();
      alert("الحد الأقصى 5 صور. احذف صورة أولاً.");
    }
  }
  var camLab = $("#pCamLab");
  var galLab = $("#pGalLab");
  if (camLab) camLab.addEventListener("click", guard);
  if (galLab) galLab.addEventListener("click", guard);

  gradeBtn.onclick = async function() {
    if (!selectedImages.length || PAPER.busy) return;
    PAPER.busy = true;
    gradeBtn.disabled = true;
    gradeBtn.textContent = "جاري التصحيح... قد يستغرق دقيقة ⏳";
    try {
      var r = await jpost("paper/grade", {
        grade: S.grade,
        subject: PAPER.subject,
        images: selectedImages,
        image: selectedImages[0]
      });
      PAPER.result = r;
      PAPER.step = "result";
      savePaperRes();
      try{
        var det=(r.details||[]).map(function(d){
          var qi=(d.n||1)-1;
          var qq=PAPER.questions&&PAPER.questions[qi]?PAPER.questions[qi]:("سؤال "+(d.n||""));
          return {n:d.n||0,ok:!!d.ok,q:String(qq).slice(0,200),note:String(d.note||"").slice(0,200)};
        });
        logActivity("paper",PAPER.subject,r.score||0,r.total||0,"",det);
        var wrong=[];
        (r.details||[]).forEach(function(d){
          if(d&&d.ok===false){
            var qi=(d.n||1)-1;
            var qq=PAPER.questions&&PAPER.questions[qi]?PAPER.questions[qi]:("سؤال "+(d.n||""));
            wrong.push({q:qq,a:(d.note||"").replace(/^.*?الصحيح[:：]?\s*/,"")||"",subject:PAPER.subject,chapter:""});
          }
        });
        if(wrong.length)addReviewItems(wrong,"paper");
      }catch(e){}
      drawPaperResult();
    } catch (e) {
      PAPER.busy = false;
      refreshPrev();
      var msg = (e && e.message) ? e.message : "تعذر التصحيح";
      alert(msg + "\nتأكد أن الصور واضحة، وأن الأجوبة مضافة في الإدارة، والموديل يدعم الصور.");
    }
  };

  $("#pBack").onclick = function() {
    PAPER.step = "pick";
    PAPER.subject = "";
    PAPER.questions = [];
    PAPER.result = null;
    rPaper();
  };
}

function drawPaperResult() {
  var b = $("#b-paper");
  var r = PAPER.result || {};
  var pc = r.percent || 0;
  var emoji = pc >= 80 ? "🎉" : pc >= 50 ? "👍" : "💪";
  var h = '<div class="card" style="text-align:center;margin-bottom:14px">';
  h += '<div style="font-size:48px">' + emoji + '</div>';
  h += '<b style="font-size:24px">درجتك: ' + ar(r.score || 0) + ' من ' + ar(r.total || 10) + '</b>';
  h += '<div class="sub" style="margin:6px 0 0">' + ar(pc) + '%</div>';
  if (r.summary) h += '<p style="line-height:1.8;margin:14px 0 0">' + esc(r.summary) + '</p>';
  h += '</div>';

  if (r.details && r.details.length) {
    h += '<h2 style="margin:18px 0 10px">تفاصيل التصحيح</h2>';
    r.details.forEach(function(d) {
      var cls = d.ok ? "rs ok" : "rs bad";
      h += '<div class="card ' + cls + '" style="margin-bottom:10px">';
      h += '<b>السؤال ' + ar(d.n) + ' — ' + (d.ok ? "✅ صح" : "❌ خطأ") + '</b>';
      if (d.student) h += '<div class="sub" style="margin-top:8px"><b>قراءة من ورقتك:</b> ' + esc(d.student) + '</div>';
      if (d.note) h += '<div class="sub" style="margin-top:6px;line-height:1.8">' + esc(d.note) + '</div>';
      h += '</div>';
    });
  }

  h += '<div class="row" style="margin-top:16px"><button id="pAgain">امتحان جديد</button><button class="ghost" id="pHome">الرئيسية</button></div>';
  b.innerHTML = h;
  PAPER.busy = false;
  savePaperRes();

  $("#pAgain").onclick = function() {
    PAPER.step = "pick";
    PAPER.subject = "";
    PAPER.questions = [];
    // لا نمسح النتيجة المحفوظة — تبقى في آخر نتيجة
    PAPER.result = null;
    rPaper();
  };
  $("#pHome").onclick = function() { go("home"); };
}

var GRP={msgs:[],poll:null,busy:false,lastT:0};

async function rGroup(){
  stopGroupPoll();

  if(!S.username){drawGroupRegister();return}

function drawGroupRegister(){
  var b=$("#b-group");

      S.username=r.username;S.chatDisplay=r.display||d;S.grade=r.grade||g;S.verified=!!r.verified||r.username==="aaa";save();
      drawGroupChat();
    }catch(e){
      $("#gReg").disabled=false;$("#gReg").textContent="إنشاء اليوزر ودخول الكروب";
      $("#gErr").textContent=(e&&e.message)||"تعذر التسجيل، جرب يوزر ثاني";

async function loadGroupMsgs(){
  try{
    var r=await jpost("chat/messages",{grade:S.grade,after:GRP.lastT||0});
    var list=r.messages||[];
    if(list.length){
      if(!GRP.lastT)GRP.msgs=list;
      else{
        list.forEach(function(m){
          if(!GRP.msgs.some(function(x){return x.id===m.id}))GRP.msgs.push(m);
        });
      }
      GRP.lastT=Math.max.apply(null,GRP.msgs.map(function(m){return m.t||0}).concat([GRP.lastT||0]));
      if(GRP.msgs.length>120)GRP.msgs=GRP.msgs.slice(-120);
      renderGroupMsgs();
    }
  }catch(e){}
}
function isMuted(u){return (S.muted||[]).indexOf(String(u||"").toLowerCase())>=0}
function toggleMute(u){
  u=String(u||"").toLowerCase();
  if(!u||u===S.username)return;
  S.muted=S.muted||[];
  var i=S.muted.indexOf(u);
  if(i>=0)S.muted.splice(i,1);else S.muted.push(u);
  save();renderGroupMsgs();
}
function verifiedBadge(on, light){
  if(!on)return "";
  return ' <span title="حساب موثّق" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;font-weight:900;vertical-align:middle;line-height:16px">✓</span>';
}
function renderGroupMsgs(){
  var box=$("#gMsgs");if(!box)return;
  var list=GRP.msgs.filter(function(m){return !isMuted(m.user)});
  if(!list.length){box.innerHTML='<div class="sub" style="text-align:center;padding:20px">'+(GRP.msgs.length?"كل الرسائل من أشخاص مكتومين.":"ماكو رسائل بعد. اكتب أول رسالة 👋")+'</div>';return}
  box.innerHTML=list.map(function(m){
    var mine=m.user===S.username;
    var ver=!!(m.verified||(mine&&S.verified)||String(m.user||"").toLowerCase()==="aaa");
    var actions=mine
      ?('<button type="button" data-del="'+esc(m.id)+'" style="margin-top:6px;padding:4px 10px;font-size:12px;background:rgba(0,0,0,.15);color:inherit;border-radius:8px;box-shadow:none">حذف</button>')
      :('<button type="button" data-mute="'+esc(m.user)+'" style="margin-top:6px;padding:4px 10px;font-size:12px;background:var(--pri2);color:var(--pri);border-radius:8px;box-shadow:none">'+(isMuted(m.user)?"إلغاء الكتم":"كتم")+"</button>");
    return '<div style="margin-bottom:10px;display:flex;flex-direction:column;align-items:'+(mine?'flex-start':'flex-end')+'">'+
      '<div style="max-width:85%;background:'+(mine?'var(--grad2)':'var(--card)')+';color:'+(mine?'#fff':'var(--tx)')+';border:1px solid var(--bd);border-radius:16px;padding:10px 12px;line-height:1.7">'+
      '<div style="font-size:12px;opacity:.9;margin-bottom:4px;font-weight:700">'+esc(m.display||m.user)+verifiedBadge(ver)+(mine?' · أنت':' · @'+esc(m.user))+'</div>'+
      esc(m.text)+actions+'</div></div>';
  }).join("");
  box.querySelectorAll("[data-del]").forEach(function(btn){
    btn.onclick=async function(){
      if(!confirm("حذف الرسالة؟"))return;
      try{
        await jpost("chat/delete",{username:S.username,id:btn.dataset.del});
        GRP.msgs=GRP.msgs.filter(function(m){return m.id!==btn.dataset.del});
        renderGroupMsgs();
      }catch(e){alert((e&&e.message)||"تعذر الحذف")}
    };
  });
  box.querySelectorAll("[data-mute]").forEach(function(btn){
    btn.onclick=function(){toggleMute(btn.dataset.mute)};
  });
  box.scrollTop=box.scrollHeight;
}
async function drawGroupChat(){
  var b=$("#b-group");
  GRP.msgs=[];GRP.lastT=0;
  var members="—";
  try{var inf=await jpost("chat/info",{grade:S.grade});members=ar(inf.members||0)}catch(e){}
  if(S.username==="aaa")S.verified=true;
  var muteN=(S.muted||[]).length;
  b.innerHTML='<div class="card" style="margin-bottom:10px"><b>كروب: '+esc(S.grade)+'</b>'+
    '<div class="sub">يوزرك: @'+esc(S.username)+(S.verified||S.username==="aaa"?verifiedBadge(true):"")+' · أعضاء تقريباً: '+members+(muteN?' · مكتومين: '+ar(muteN):"")+'</div>'+
    '<p class="sub" style="margin-top:6px;line-height:1.7">تقدر تحذف رسائلك وتكتم أي طالب. الحسابات الموثّقة عليها علامة زرقاء.</p>'+
    (muteN?'<button class="ghost sm" id="gUnmuteAll" style="margin-top:8px">إلغاء كتم الجميع</button>':'')+
    '</div>'+
    '<div id="gMsgs" class="card" style="height:380px;overflow:auto;margin-bottom:10px"></div>'+
    '<div class="card"><textarea id="gTx" placeholder="اكتب رسالة لطلاب صفّك..." style="min-height:70px"></textarea>'+
    '<button id="gSend" style="width:100%;margin-top:8px">إرسال</button></div>';
  await loadGroupMsgs();
  renderGroupMsgs();
  if($("#gUnmuteAll"))$("#gUnmuteAll").onclick=function(){S.muted=[];save();renderGroupMsgs();drawGroupChat()};
  stopGroupPoll();
  GRP.poll=setInterval(function(){if(document.getElementById("gMsgs"))loadGroupMsgs();else stopGroupPoll()},8000);
  $("#gSend").onclick=async function(){
    var t=($("#gTx").value||"").trim();if(!t||GRP.busy)return;
    GRP.busy=true;$("#gSend").disabled=true;
    try{
      var r=await jpost("chat/send",{username:S.username,text:t});
      if(r.message){GRP.msgs.push(r.message);GRP.lastT=Math.max(GRP.lastT,r.message.t||0);renderGroupMsgs()}
      $("#gTx").value="";
    }catch(e){alert((e&&e.message)||"تعذر الإرسال")}
    GRP.busy=false;$("#gSend").disabled=false;
  };
}

function startPhys(mode){
  PHYS.mode=mode;PHYS.i=0;PHYS.sc=0;PHYS.t=mode==="timed"?60:0;
  var bank=physBank();
  if(mode==="tf"){
    PHYS.list=bank.slice(0,10).map(function(x){
      var truth=Math.random()>0.45;
      if(truth) return {q:x.q+" — الإجابة: "+x.a, ok:true, a:"صح"};
      var wrong=(x.o&&x.o[0])||"قيمة أخرى";
      return {q:x.q+" — الإجابة: "+wrong, ok:false, a:"خطأ"};
    });
  }else{
    PHYS.list=bank.slice(0, mode==="timed"?30:10);
  }
  if(!PHYS.list.length){alert("بنك الفيزياء فاضي");return}
  if(mode==="timed"){
    physStop();
    PHYS.tid=setInterval(function(){
      PHYS.t--;
      var el=$("#pTime");if(el)el.textContent=ar(PHYS.t);
      if(PHYS.t<=0){physStop();drawPhysEnd()}
    },1000);
  }
  drawPhysQ();
}
function drawPhysQ(){
  var b=$("#b-phys");
  if(PHYS.mode==="timed"&&PHYS.t<=0)return drawPhysEnd();
  if(PHYS.i>=PHYS.list.length)return drawPhysEnd();
  var x=PHYS.list[PHYS.i];
  var head='<div class="sub">سؤال '+(PHYS.i+1)+(PHYS.mode==="timed"?' · الوقت: <b id="pTime">'+ar(PHYS.t)+'</b> ث':' من '+PHYS.list.length)+' · نقاط الجولة: '+ar(PHYS.sc)+'</div>';
  if(PHYS.mode==="tf"){
    b.innerHTML=head+'<div class="card q"><b>'+esc(x.q)+'</b>'+
      '<button class="ch" data-v="1">صح</button><button class="ch" data-v="0">خطأ</button><div class="msg"></div></div>';
    var locked=false;
    b.querySelectorAll(".ch").forEach(function(btn){
      btn.onclick=function(){
        if(locked)return;locked=true;
        var ans=btn.dataset.v==="1";
        var ok=ans===x.ok;
        b.querySelectorAll(".ch").forEach(function(t){t.disabled=true});
        if(ok){btn.classList.add("good");PHYS.sc++;b.querySelector(".msg").textContent="صح ✓"}
        else{btn.classList.add("bad");b.querySelector(".msg").textContent="خطأ"}
        setTimeout(function(){PHYS.i++;drawPhysQ()},550);
      };
    });

  }
  var choices=shuf([[x.a,1]].concat((x.o||[]).map(function(o){return[o,0]})));
  b.innerHTML=head+'<div class="card q"><b>'+esc(x.q)+'</b>'+choices.map(function(c){return '<button class="ch" data-ok="'+c[1]+'">'+esc(c[0])+'</button>'}).join('')+'<div class="msg"></div></div>';

    };
  });

function normAr(s){
  return String(s||"")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/ء/g,"")
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g," ")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}
function tokensAr(s){
  return normAr(s).split(" ").filter(function(w){
    return w.length>1 && "من في على الى الي عن مع هذا هذه ذلك تلك التي الذي لان لانه لانها و أو او ما لا لم لن قد كل بعض".split(" ").indexOf(w)<0;
  });
}
function closeAnswer(student, model){
  if(!student||!model)return false;
  var a=normAr(student), b=normAr(model);
  if(!a||!b)return false;
  if(a===b)return true;
  if(a.length>=3 && (b.indexOf(a)>=0 || a.indexOf(b)>=0))return true;
  var ta=tokensAr(student), tb=tokensAr(model);
  if(!ta.length||!tb.length)return false;
  // تطابق كلمات مهمة
  var hit=0;
  ta.forEach(function(w){if(tb.indexOf(w)>=0)hit++});
  var ratio=hit/Math.min(ta.length,tb.length);
  if(ratio>=0.45)return true;
  // جذور قصيرة مشتركة (3 أحرف+)
  var rootHit=0;
  ta.forEach(function(w){
    if(w.length<3)return;
    for(var i=0;i<tb.length;i++){
      if(tb[i].length<3)continue;
      if(w.indexOf(tb[i].slice(0,3))>=0||tb[i].indexOf(w.slice(0,3))>=0){rootHit++;break}
    }
  });
  return rootHit>=2 || (rootHit>=1 && Math.min(ta.length,tb.length)<=2);
}
function drawPathQ(){
  var b=$("#b-path");
  if(PATH.i>=PATH.list.length){PATH.done=true;rPath();return}
  var it=PATH.list[PATH.i],tot=PATH.list.length;
  b.innerHTML='<div class="sub">مراجعة '+(PATH.i+1)+" من "+tot+'</div><div class="bar2"><i style="width:'+Math.round(PATH.i/tot*100)+'%"></i></div>'+

    '<button id="pChk" style="width:100%;margin-top:10px">تحقق</button><div id="pFb"></div></div>';
  $("#pChk").onclick=function(){
    var ans=($("#pAns").value||"").trim();

    markReviewResult(it.id,ok);

/* المساعد الذكي: يسأل بالصوت، يسمع إجابتك، ويصحّحها */
var AI={all:null,grade:"",qs:[],i:0,ok:0,mid:0,wrong:[],sound:true,auto:false,rec:null,ans:false,tok:0,view:"setup",err:""};
var SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
var TTS={ok:"speechSynthesis" in window,voice:null};
function pickVoice(){try{var v=speechSynthesis.getVoices();TTS.voice=v.filter(function(x){return /^ar([-_]|$)/i.test(x.lang)})[0]||null}catch(e){}}
if(TTS.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}

function say(text,cb){
  var tok=AI.tok;
  if(!TTS.ok||!AI.sound){if(cb)cb();return}
  try{speechSynthesis.cancel()}catch(e){}
  var parts=(String(text).match(/[^.؟?!\n]+[.؟?!\n]*/g)||[String(text)]).map(function(s){return s.trim()}).filter(Boolean),i=0,bt=$("#bot");
  if(bt)bt.classList.add("say");
  function done(){var b=$("#bot");if(b)b.classList.remove("say");if(cb&&tok===AI.tok)cb()}
  (function next(){
    if(i>=parts.length||tok!==AI.tok){done();return}
    var u=new SpeechSynthesisUtterance(parts[i++]);u.lang=TTS.voice?TTS.voice.lang:"ar-SA";if(TTS.voice)u.voice=TTS.voice;u.rate=.95;
    u.onend=next;u.onerror=done;
    try{speechSynthesis.speak(u)}catch(e){done()}
  })();
}
function stopMic(){if(AI.rec){var r=AI.rec;AI.rec=null;try{r.abort()}catch(e){}}var m=$("#aMic");if(m)m.classList.remove("on")}
function aiStop(){AI.tok++;try{speechSynthesis.cancel()}catch(e){}stopMic()}

/* فهم الإجابة: مقارنة الكلمات المهمة مع الجواب الصحيح */
var STOP={};"في من على الي عن هو هي ان التي الذي الذين ما هذا هذه ذلك تلك او ثم كل قد كان يكون تكون بين عند مع لا بعض اي كما حيث ذو هم هن لها له به بها فيها فيه منه منها ايضا اذا عندما".split(" ").forEach(function(w){STOP[w]=1});
function norm(s){return String(s||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase().replace(/[^\u0621-\u063A\u0641-\u064Aa-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function stem(w){
  w=w.replace(/^(وال|بال|كال|فال|لل|ال)/,"").replace(/^و(?=.{4,})/,"");
  var r=w.replace(/(ها|هم|هن|كم|ات|ون|ين|ان)$/,"");
  return r.length>=3?r:w;
}
function terms(s){var seen={},o=[];norm(s).split(" ").forEach(function(w){if(!w||STOP[w])return;w=stem(w);if(w.length>=2&&!seen[w]){seen[w]=1;o.push(w)}});return o}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function same(a,b){
  if(a===b)return true;if(a.length<3||b.length<3||a[0]!==b[0])return false;
  if(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0))return true;
  var mx=Math.max(a.length,b.length);return 1-lev(a,b)/mx>=(mx>=5?.75:.66);
}
var NEG={"غير":1,"ليس":1,"ليست":1,"لا":1,"ما":1,"بدون":1,"عدم":1,"لم":1,"لن":1,"دون":1};
function hasNeg(s){return norm(s).split(" ").some(function(w){return NEG[w]})}
function evaluate(ans,corr){
  var kt=terms(corr),st=terms(ans),hit=[],miss=[];
  kt.forEach(function(k){(st.some(function(s){return same(s,k)})?hit:miss).push(k)});
  var sc=kt.length&&st.length?hit.length/kt.length:0;
  if(sc>0&&hasNeg(corr)!==hasNeg(ans))sc*=.5; /* عكس المعنى (نفي/إثبات) */
  return{score:sc,missing:miss};
}
function markMissing(corr,miss){
  var words=[];
  var html=String(corr).split(/(\s+)/).map(function(w){var s=stem(norm(w).replace(/\s/g,""));if(s&&miss.indexOf(s)>-1){words.push(w.replace(/[.,،؟?!]/g,""));return "<mark>"+esc(w)+"</mark>"}return esc(w)}).join("");
  return{html:html,words:words};
}

/* الشاشة */
async function rAI(){
  var b=$("#b-ai");AI.view="setup";
  if(!AI.all||AI.grade!==S.grade){loading(b);try{AI.all=await jget("questions?grade="+encodeURIComponent(S.grade));AI.grade=S.grade}catch(e){return errBox(b,rAI)}}
  var subj=[];AI.all.forEach(function(q){if(subj.indexOf(q.subject)<0)subj.push(q.subject)});
  var inapp=/FBAN|FBAV|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent),notes=[];
  if(!TTS.ok)notes.push("متصفحك لا يدعم قراءة الأسئلة بالصوت.");
  if(!SRC)notes.push("الإجابة بالصوت غير مدعومة في متصفحك، لكن تقدر تكتب إجابتك.");
  if(inapp)notes.push("إذا لم يعمل المايك، افتح الرابط في متصفح Chrome بدل تطبيق فيسبوك.");
  b.innerHTML='<div class="bub"><div class="bot">🤖</div><div>أهلاً! أنا مساعدك الذكي. أسألك بصوتي، وتجاوبني بصوتك أو بالكتابة، وإذا أخطأت أصحّح لك الإجابة.</div></div>'+
    (AI.all.length?'<div class="card"><label class="lb">المادة</label><select id="aS"><option value="">كل المواد</option>'+subj.map(function(s){return "<option>"+esc(s)+"</option>"}).join("")+'</select><label class="lb">الفصل</label><select id="aC"></select><label class="lb">عدد الأسئلة</label><select id="aN"><option value="5">5 أسئلة</option><option value="10" selected>10 أسئلة</option><option value="0">كل الأسئلة</option></select>'+
      '<label class="chk"><input type="checkbox" id="aV" checked> 🔊 قراءة الأسئلة بصوت عالٍ</label>'+(SRC?'<label class="chk"><input type="checkbox" id="aA"> 💬 وضع المحادثة: يفتح المايك تلقائياً بعد كل سؤال</label>':"")+
      '<button id="aGo" style="width:100%;margin-top:14px">ابدأ الأسئلة 🎤</button>'+(notes.length?'<p class="sub" style="margin-top:10px;line-height:1.8">'+notes.map(esc).join("<br>")+"</p>":"")+"</div>":'<div class="card">لا توجد أسئلة لصفك بعد، تابعنا قريباً.</div>');
  if(!AI.all.length)return;
  function chap(){var s=$("#aS").value,c=[];AI.all.forEach(function(q){if((!s||q.subject===s)&&c.indexOf(q.chapter)<0)c.push(q.chapter)});$("#aC").innerHTML='<option value="">كل الفصول</option>'+c.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")}
  $("#aS").onchange=chap;chap();
  $("#aGo").onclick=function(){
    var s=$("#aS").value,c=$("#aC").value,n=+$("#aN").value;
    var l=shuf(AI.all.filter(function(q){return (!s||q.subject===s)&&(!c||q.chapter===c)}));if(n)l=l.slice(0,n);
    AI.sound=$("#aV").checked;AI.auto=!!($("#aA")&&$("#aA").checked&&SRC);AI.qs=l;AI.i=0;AI.ok=0;AI.mid=0;AI.wrong=[];drawQ();
  };
}
function drawQ(){
  AI.view="q";AI.ans=false;AI.tok++;stopMic();
  var b=$("#b-ai"),q=AI.qs[AI.i],tot=AI.qs.length;
  b.innerHTML='<div class="sub">السؤال '+(AI.i+1)+" من "+tot+'</div><div class="bar2"><i style="width:'+Math.round(AI.i/tot*100)+'%"></i></div>'+
    '<div class="bub"><div class="bot" id="bot">🤖</div><div><b>'+esc(q.q)+'</b><div class="sub">'+esc(q.subject)+" · "+esc(q.chapter)+"</div></div></div>"+
    '<div class="row" style="margin-bottom:10px"><button class="ghost" id="aRe">🔊 أعد السؤال</button><button class="ghost" id="aSk">تخطي ⏭</button></div>'+
    '<div class="card" id="aIn" style="text-align:center">'+(SRC?'<button class="mic" id="aMic" aria-label="تحدث">🎤</button><div class="sub" id="aLive" style="margin-top:8px;min-height:1.6em">اضغط المايك وجاوب بصوتك</div>':"")+
    '<textarea id="aTx" placeholder="أو اكتب إجابتك هنا..." style="min-height:80px;margin-top:10px"></textarea><button id="aSd" style="width:100%;margin-top:8px">إرسال الإجابة</button></div><div id="aRs"></div>';
  $("#aRe").onclick=function(){AI.tok++;say(q.q)};
  $("#aSk").onclick=function(){finish("",true)};
  $("#aSd").onclick=function(){var v=$("#aTx").value.trim();if(v)finish(v)};
  if($("#aMic"))$("#aMic").onclick=function(){if(AI.rec){var r=AI.rec;try{r.stop()}catch(e){}}else startMic()};
  say("السؤال "+(AI.i+1)+". "+q.q,function(){if(AI.auto&&SRC&&AI.view==="q"&&!AI.ans)startMic()});
}
function startMic(){
  if(!SRC||AI.rec||AI.ans)return;
  try{speechSynthesis.cancel()}catch(e){}
  var r=new SRC(),got="",tok=AI.tok;AI.err="";
  r.lang="ar-IQ";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=function(){var m=$("#aMic");if(m)m.classList.add("on");var l=$("#aLive");if(l)l.textContent="🎙 أسمعك... تكلّم"};
  r.onresult=function(e){var s="";for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;got=s;var l=$("#aLive");if(l)l.textContent="«"+s+"»";var x=$("#aTx");if(x)x.value=s};
  r.onerror=function(e){AI.err=e.error||"error"};
  r.onend=function(){
    if(AI.rec===r)AI.rec=null;var m=$("#aMic");if(m)m.classList.remove("on");
    if(tok!==AI.tok||AI.ans)return;
    if(got.trim()){finish(got.trim());return}
    var l=$("#aLive");if(l)l.textContent=/not-allowed|service-not-allowed/.test(AI.err)?"اسمح للمتصفح باستخدام المايك من إعدادات الموقع":AI.err==="network"?"الإنترنت ضعيف، حاول مرة ثانية":"ما سمعتك، اضغط المايك وحاول مرة ثانية";
  };
  AI.rec=r;try{r.start()}catch(e){AI.rec=null}
}
var PRAISE=["أحسنت! إجابتك صحيحة.","ممتاز، إجابة صحيحة.","عفية عليك! صح."];
function finish(text,skip){
  if(AI.ans)return;AI.ans=true;stopMic();
  var q=AI.qs[AI.i],ev=evaluate(text,q.a),v=skip?"bad":ev.score>=.65?"ok":ev.score>=.3?"mid":"bad";
  if(v==="ok")AI.ok++;else{AI.wrong.push(q);if(v==="mid")AI.mid++}
  var mk=markMissing(q.a,ev.missing),last=AI.i===AI.qs.length-1,h;
  if(v==="ok")h='<div class="card rs ok"><b>✅ إجابة صحيحة 🎉</b>'+(text?'<div class="ans">'+esc(text)+"</div>":"")+"</div>";
  else h='<div class="card rs '+v+'"><b>'+(skip?"⏭ تخطيت السؤال":v==="mid"?"⚠️ إجابتك قريبة لكنها ناقصة":"❌ إجابتك غير صحيحة")+"</b>"+(text?'<div class="sub" style="margin-top:8px">إجابتك:</div><div class="ans">'+esc(text)+"</div>":"")+'<div class="sub">الإجابة الصحيحة:</div><div class="ans">'+mk.html+"</div>"+(mk.words.length&&text?'<div class="sub">كلمات مهمة نقصت من إجابتك: <b>'+esc(mk.words.join("، "))+"</b></div>":"")+"</div>";
  $("#aRs").innerHTML=h+'<button id="aNx" style="width:100%">'+(last?"عرض النتيجة":"السؤال التالي")+"</button>";
  $("#aIn").classList.add("hide");$("#aRe").classList.add("hide");$("#aSk").classList.add("hide");
  function nx(){AI.i++;if(AI.i>=AI.qs.length)endAI();else drawQ();window.scrollTo(0,0)}
  $("#aNx").onclick=function(){AI.tok++;try{speechSynthesis.cancel()}catch(e){}nx()};
  var spoken=v==="ok"?PRAISE[Math.floor(Math.random()*PRAISE.length)]:(skip?"":v==="mid"?"إجابتك قريبة لكنها ناقصة. ":"إجابتك غير صحيحة. ")+"الإجابة الصحيحة هي: "+q.a;
  say(spoken,function(){if(AI.auto)setTimeout(function(){if(AI.view==="q"&&AI.qs[AI.i]===q)nx()},900)});
}
function endAI(){
  AI.view="end";AI.tok++;var b=$("#b-ai"),n=AI.qs.length,pc=Math.round(AI.ok/n*100);
  try{
    var subj=(AI.qs[0]&&AI.qs[0].subject)||"";
    logActivity("ai",subj,AI.ok,n,"");
    if(AI.wrong&&AI.wrong.length)addReviewItems(AI.wrong.map(function(q){return{q:q.q,a:q.a,subject:q.subject,chapter:q.chapter}}),"ai");
  }catch(e){}
  b.innerHTML='<div class="card" style="text-align:center"><div style="font-size:46px">'+(pc>=70?"🎉":pc>=50?"👍":"💪")+'</div><b style="font-size:22px">أجبت صح على '+AI.ok+" من "+n+'</b><div class="sub" style="margin:6px 0 14px">'+pc+"%"+(AI.mid?" · إجابات ناقصة: "+AI.mid:"")+'</div><div class="row">'+(AI.wrong.length?'<button id="aRt">أعد الأسئلة الخاطئة</button>':"")+'<button class="ghost" id="aNw">جلسة جديدة</button></div></div>'+
    (AI.wrong.length?'<h2>للمراجعة</h2>'+AI.wrong.map(function(q){return '<div class="card"><b>'+esc(q.q)+'</b><div class="ans">'+esc(q.a)+"</div></div>"}).join(""):"");
  if($("#aRt"))$("#aRt").onclick=function(){AI.qs=shuf(AI.wrong);AI.i=0;AI.ok=0;AI.mid=0;AI.wrong=[];drawQ()};
  $("#aNw").onclick=rAI;
  say("انتهت الجلسة. أجبت صح على "+AI.ok+" من "+n+(AI.wrong.length?". سأذكّرك بالأسئلة التي أخطأت بها لتراجعها.":". أحسنت!"));
}

/* الملف الشخصي: تسجيل أول دخول مرة واحدة، ويشمل الطلاب القدامى بعد التحديث */
function needProfile(){
  return !(S.profileVersion===1 && S.name && S.name.trim().length>=2 && S.school && S.school.trim().length>=2 && S.grade);
}
function showProfileGate(force){
  if(!force&&!needProfile())return false;
  if($("#profileGate"))return true;
  var grades=Object.keys((INFO&&INFO.grades)||{});
  var gradeOptions='<option value="">اختر صفك الدراسي</option>'+grades.map(function(g){return '<option value="'+esc(g)+'"'+(g===S.grade?' selected':'')+'>'+esc(g)+'</option>'}).join('');
  var ov=document.createElement("div");
  ov.id="profileGate";
  ov.className="profile-gate-backdrop";
  ov.setAttribute("role","dialog");
  ov.setAttribute("aria-modal","true");
  ov.setAttribute("aria-labelledby","profileGateTitle");
  ov.innerHTML='<div class="profile-gate-card">'+
    '<div class="profile-gate-top"><div class="profile-gate-mark">🎓</div><span class="profile-gate-tag">✦ ملف الطالب · إعداد لمرة واحدة</span></div>'+
    '<h2 id="profileGateTitle">خلّينا نتعرّف عليك</h2>'+
    '<p class="profile-gate-desc">سجّل معلوماتك حتى نجهّز لك محتوى ومواد تناسب صفّك ومدرستك.</p>'+
    '<div class="profile-gate-progress"><span></span></div>'+
    '<div class="profile-gate-field"><label for="pfName">اسم الطالب</label><div class="profile-gate-input"><span>👤</span><input id="pfName" maxlength="40" autocomplete="name" placeholder="اكتب اسمك الكامل" value="'+esc(S.name||'')+'"></div></div>'+
    '<div class="profile-gate-field"><label for="pfGrade">الصف الدراسي</label><div class="profile-gate-input"><span>📚</span><select id="pfGrade">'+gradeOptions+'</select><span class="profile-gate-chevron">⌄</span></div></div>'+
    '<div class="profile-gate-field"><label for="pfSchool">اسم المدرسة</label><div class="profile-gate-input"><span>🏫</span><input id="pfSchool" maxlength="100" autocomplete="organization" placeholder="مثال: ثانوية النور للبنين" value="'+esc(S.school||'')+'"></div></div>'+
    '<button id="pfSave" class="profile-gate-submit"><span>دخول المنصة</span><span aria-hidden="true">←</span></button>'+
    '<div class="profile-gate-foot"><span>🔒</span> تُحفظ ضمن ملفك الدراسي، وتبقى مسجلاً على نفس المتصفح عند الزيارات القادمة.</div>'+
    (force?'<button class="profile-gate-cancel" id="pfCancel">إلغاء</button>':'')+
  '</div>';
  document.body.appendChild(ov);
  var nameInput=$("#pfName");
  setTimeout(function(){if(nameInput)nameInput.focus()},100);
  $("#pfSave").onclick=function(){
    var n=($("#pfName").value||"").trim();
    var g=$("#pfGrade").value;
    var school=($("#pfSchool").value||"").trim();
    if(n.length<2){alert("اكتب اسم الطالب بشكل صحيح");$("#pfName").focus();return}
    if(!g){alert("اختر صفك الدراسي");$("#pfGrade").focus();return}
    if(school.length<2){alert("اكتب اسم المدرسة");$("#pfSchool").focus();return}
    S.name=n;S.grade=g;S.school=school;
    /* علامة الإصدار تجبر أصحاب الملفات القديمة على إكمال البيانات مرة واحدة فقط */
    S.profileVersion=1;S.profileCompletedAt=Date.now();
    save();
    syncProfileNow();
    ov.remove();
    if(typeof rHome==="function"&&$("#hi"))rHome();
  };
  if($("#pfCancel"))$("#pfCancel").onclick=function(){ov.remove()};
  return true;
}

/* التشغيل */
async function boot(){
  try{INFO=await jget("info")}catch(e){$("#boot").innerHTML='تعذر الاتصال بالخادم.<br><button id="rb" style="margin-top:10px">إعادة المحاولة</button>';$("#rb").onclick=function(){location.reload()};return}
  if(S.me){try{REC=await jpost("result",{code:S.me});S.grade=REC.g}catch(e){if(e===404){S.me="";save()}}}
  var gs=Object.keys(INFO.grades);if(!INFO.grades[S.grade])S.grade=gs[0]||"";
  $("#boot").classList.add("hide");build();go("home");
  showProfileGate(false);
}
boot();

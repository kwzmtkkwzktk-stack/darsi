<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنصة الدراسية | دليل العراق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#ffffff;--card:#fff;--tx:#14213d;--mut:#8a94a3;--pri:#2459a8;--pri2:#e6eefa;--red:#c8102e;--bd:#e6eaee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202b;--tx:#e8edf5;--mut:#93a0b3;--pri:#6aa6ff;--pri2:#1b2a40;--bd:#263244}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202b;--tx:#e8edf5;--mut:#93a0b3;--pri:#6aa6ff;--pri2:#1b2a40;--bd:#263244}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:21px;margin:26px 0 14px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin:2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 18px}
.top select{width:auto;max-width:56%;font-size:13px;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:22px 8px 18px;text-align:center;color:var(--tx);font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 18px rgba(20,33,61,.07)}
.tile:active{transform:scale(.97)}
.ic{width:58px;height:58px;border-radius:19px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}.ic svg{width:26px;height:26px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:18px 4px 14px;text-align:center;box-shadow:0 4px 18px rgba(20,33,61,.07)}
.st em{display:block;font-style:normal;height:22px}.st em svg{width:22px;height:22px;fill:currentColor}#e1{color:#2459a8}#e2{color:#2e9e5b}#e3{color:#e8a31c}
.st b{display:block;font-size:30px;margin:6px 0 2px;font-weight:800}
.st span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2e6fc7,#1b4a8f);color:#fff;border:0}
.hero h2{margin:0 0 4px}.hero p{margin:0;color:#dbe8fb}.hero a{color:#fff}
select,input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:700}
button.ghost{background:var(--pri2);color:var(--pri)}
button.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.back{background:var(--card);color:var(--tx);width:42px;height:42px;padding:0;font-size:20px;border:1px solid var(--bd)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border:0}
.badge{background:var(--pri2);color:var(--pri);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.bar2{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--pri)}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--pri2);color:var(--pri)}.seg button.on{background:var(--pri);color:#fff}
.ring{position:relative;width:220px;height:220px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;direction:ltr}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}th,td{border:1px solid var(--bd);padding:8px 4px;text-align:center}th{background:var(--pri2);color:var(--pri)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;color:var(--tx);font-weight:700;font-size:16px;margin-bottom:10px;text-align:right}.qa{margin-top:10px;padding:10px 12px;background:var(--pri2);border-radius:12px;line-height:1.8;font-size:15px}.qa b{color:var(--pri)}
.ch{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:500;font-size:15px;line-height:1.7}.ch.good{background:rgba(46,158,91,.16);border-color:#2e9e5b}.ch.bad{background:rgba(214,69,69,.14);border-color:#d64545}.msg{margin-top:10px;font-size:14px;font-weight:700}
.hide{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mut);padding:8px 0;font-size:12px;border-radius:12px}
nav button i{display:block;margin:0 auto 2px;width:22px;height:22px;font-style:normal}nav button svg{width:22px;height:22px;fill:currentColor}nav button.on{color:var(--pri);background:var(--pri2)}

input[type=number],input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;min-height:140px;line-height:1.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fi{display:flex;gap:12px;align-items:center}
.ic2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ic2 svg{width:22px;height:22px;fill:currentColor}
.fi .t{flex:1;min-width:0}.fi .t b{display:block;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:10px}.acts a{flex:1}
a.btn{display:block;text-align:center;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none}
a.btn.g{background:var(--pri2);color:var(--pri)}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}.ov.on{display:flex}
.sheet{background:var(--card);border-radius:22px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:14px}
.sheet iframe,.sheet video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;display:block;margin-bottom:10px}
.news img{width:100%;border-radius:14px;margin-top:8px;display:block}
.vid{cursor:pointer}.cover{width:100%;aspect-ratio:16/9;border-radius:14px;margin-bottom:10px;background:linear-gradient(135deg,#ebe5f7,#e1e9f6);display:grid;place-items:center;overflow:hidden;color:#7a4fd0}.cover img{width:100%;height:100%;object-fit:cover}.cover svg{width:44px;height:44px;fill:currentColor}
.site{font-size:13px;color:var(--pri);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="boot" class="card" style="margin-top:30px;text-align:center">جاري التحميل... إذا كان الموقع نايم قد يتأخر قليلاً ⏳</div>
  <main id="app"></main>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<nav id="nav" class="hide">
  <button data-go="home" class="on"><i data-ic="home"></i>الرئيسية</button>
  <button data-go="files"><i data-ic="books"></i>ملازمي</button>
  <button data-go="res"><i data-ic="chart"></i>نتيجتي</button>
  <button data-go="notes"><i data-ic="note"></i>ملاحظاتي</button>
</nav>

<script>
var CB='<path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V2z"/>';
var IC={
cal:CB+'<g fill="#fff" opacity=".92"><rect x="6" y="10" width="3" height="3" rx=".7"/><rect x="10.5" y="10" width="3" height="3" rx=".7"/><rect x="15" y="10" width="3" height="3" rx=".7"/><rect x="6" y="14.5" width="3" height="3" rx=".7"/><rect x="10.5" y="14.5" width="3" height="3" rx=".7"/></g>',
absent:CB+'<path d="M9.3 10.8l5.4 5.4M14.7 10.8l-5.4 5.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" fill="none"/>',
book:'<path d="M12 6.4C10.4 5.2 8.2 4.6 5 4.6c-.6 0-1 .4-1 1v11.4c0 .6.5 1 1 1 3 0 5.2.5 7 1.8 1.8-1.3 4-1.8 7-1.8.6 0 1-.4 1-1V5.6c0-.6-.4-1-1-1-3.2 0-5.4.6-7 1.8z"/><path d="M12 7v12" stroke="#fff" stroke-width="1.2" fill="none"/>',
pen:'<path d="M4 6a2 2 0 0 1 2-2h8l-2 2H6v12h12v-6l2-2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M19.4 3.6a1.5 1.5 0 0 1 2.1 2.1L12 15.2l-3 .8.8-3 9.6-9.4z"/>',
books:'<rect x="3" y="4" width="4.5" height="16" rx="1.2"/><rect x="9.2" y="4" width="4.5" height="16" rx="1.2"/><path d="M15.4 5.8l3.9-1.1 2.9 14.2-3.9 1.1z"/><g fill="#fff" opacity=".9"><rect x="3" y="8" width="4.5" height="1.3"/><rect x="9.2" y="8" width="4.5" height="1.3"/></g>',
chart:'<rect x="3" y="12" width="4.5" height="9" rx="1.2"/><rect x="9.8" y="3" width="4.5" height="18" rx="1.2"/><rect x="16.5" y="8" width="4.5" height="13" rx="1.2"/>',
doc:'<path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2l6 6h-6z" fill="#fff" opacity=".5"/><g fill="#fff" opacity=".95"><rect x="7.5" y="12" width="9" height="1.6" rx=".8"/><rect x="7.5" y="15.5" width="6" height="1.6" rx=".8"/></g>',
trophy:'<path d="M7 3h10v5a5 5 0 0 1-10 0V3z"/><path d="M7 5H3.5v2A3.5 3.5 0 0 0 7 10.5M17 5h3.5v2a3.5 3.5 0 0 1-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11" y="13" width="2" height="4"/><rect x="7.5" y="17.5" width="9" height="3" rx="1.2"/>',
home:'<path d="M12 3 2.5 11.5H5V20h5v-5.5h4V20h5v-8.5h2.5L12 3z"/>'
};
function ico(n){return '<svg viewBox="0 0 24 24">'+IC[n]+'</svg>'}
IC.video='<rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10 9.2v5.6l5-2.8z" fill="#fff"/>';
IC.note='<path d="M5 3h14a2 2 0 0 1 2 2v9l-7 7H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 21v-5a2 2 0 0 1 2-2h5" fill="#fff" opacity=".55"/><g fill="#fff" opacity=".95"><rect x="6.5" y="7" width="10" height="1.6" rx=".8"/><rect x="6.5" y="10.5" width="7" height="1.6" rx=".8"/></g>';
IC.calc='<rect x="4" y="2.5" width="16" height="19" rx="3.2"/><rect x="7" y="5.5" width="10" height="3.5" rx="1" fill="#fff" opacity=".9"/><g fill="#fff"><circle cx="8.5" cy="13" r="1.2"/><circle cx="12" cy="13" r="1.2"/><circle cx="15.5" cy="13" r="1.2"/><circle cx="8.5" cy="17" r="1.2"/><circle cx="12" cy="17" r="1.2"/><circle cx="15.5" cy="17" r="1.2"/></g>';
IC.timer='<path d="M9 2h6v2H9z"/><circle cx="12" cy="13.5" r="8"/><path d="M12 8.5v5l3 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>';
var $=function(s){return document.querySelector(s)},esc=function(v){var d=document.createElement("div");d.textContent=v==null?"":v;return d.innerHTML};
var ar=function(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})};
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var TIPS=["ادرس أصعب مادة وقت ما يكون ذهنك صافي، غالباً الصبح.","قسّم الدرس إلى أجزاء صغيرة وخلّص جزء كل جلسة.","جرّب تشرح الدرس بصوت عالي كأنك تعلّم أحد، هذا يثبّت المعلومة.","سوّ أسئلة وزارية سنوات سابقة، هي أفضل تدريب للامتحان.","نام كافي، الدماغ يرتب المعلومات وانت نايم.","ابتعد عن الموبايل أثناء الجلسة، خلّه بغرفة ثانية.","راجع كل درس بعد يوم، وبعد أسبوع، وبعد شهر."];
var S;try{S=JSON.parse(localStorage.getItem("st2"))||{}}catch(e){S={}}
S.notes=S.notes||[];S.log=S.log||{};S.me=S.me||"";S.grade=S.grade||"";
function save(){try{localStorage.setItem("st2",JSON.stringify(S))}catch(e){}}
var INFO=null,REC=null;
async function jget(u){var r=await fetch("/api/study/"+u,{cache:"no-store"});if(!r.ok)throw r.status;return r.json()}
async function jpost(u,b){var r=await fetch("/api/study/"+u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw r.status;return r.json()}
function subs(){return INFO.grades[S.grade]||[]}
function daysTo(d){return Math.ceil((new Date(d+"T00:00:00")-new Date())/864e5)}
function sz(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
function loading(b){b.innerHTML='<div class="card" style="text-align:center">جاري التحميل... ⏳</div>'}
function errBox(b,fn){b.innerHTML='<div class="card" style="text-align:center">تعذر التحميل، تأكد من الإنترنت وحاول مرة ثانية.<br><button id="rt" style="margin-top:10px">إعادة المحاولة</button></div>';$("#rt").onclick=fn}
function sheet(h){$("#sheet").innerHTML='<button class="back" id="sx" aria-label="إغلاق" style="margin-bottom:10px">✕</button>'+h;$("#ov").classList.add("on");$("#sx").onclick=closeSheet}
function closeSheet(){$("#ov").classList.remove("on");$("#sheet").innerHTML=""}
$("#ov").onclick=function(e){if(e.target===this)closeSheet()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

var T=[["files","ملازمي","books","#fdf0cf","#e8a31c"],["videos","محاضراتي","video","#ebe5f7","#7a4fd0"],["quiz","امتحاناتي","pen","#fbe1ee","#d6338a"],["res","نتيجتي","chart","#dff2e4","#2e9e5b"],["notes","ملاحظاتي","note","#e1e9f6","#2459a8"],["timer","المؤقّت","timer","#ffe6d9","#e8641c"],["calc","حاسبة المعدل","calc","#dcf0f5","#1f9bb0"],["dates","مواعيد الامتحانات","cal","#e8e6fa","#5b4fd0"]];
var TITLES={files:"ملازمي",videos:"محاضراتي",quiz:"امتحاناتي",res:"نتيجتي",notes:"ملاحظاتي",timer:"المؤقّت",calc:"حاسبة المعدل",dates:"مواعيد الامتحانات"};
var R={home:rHome,files:rFiles,videos:rVideos,quiz:rQuiz,res:rRes,notes:rNotes,timer:rTimer,calc:rCalc,dates:rDates};

function build(){
  var h='<section id="v-home" class="v"><div class="top"><div><a class="site" href="/">→ دليل العراق</a><h1 id="hi" style="margin-top:4px">أهلاً بك 👋</h1></div><select id="grade" aria-label="الصف"></select></div><div id="news"></div><div class="grid" id="tiles"></div><h2>إحصائيات سريعة</h2><div class="stats"><div class="st"><em id="e3"></em><b id="s3">0</b><span>ملاحظاتي</span></div><div class="st"><em id="e2"></em><b id="s2">—</b><span>يوم متبقي</span></div><div class="st"><em id="e1"></em><b id="s1">0</b><span>مواد دراسية</span></div></div><div class="card" style="margin-top:14px"><b>💡 نصيحة اليوم</b><p id="tip" style="line-height:1.7;margin:6px 0 0"></p></div></section>';
  Object.keys(TITLES).forEach(function(k){h+='<section id="v-'+k+'" class="v hide"><div class="bar"><button class="back" data-bk="'+k+'" aria-label="رجوع">→</button><h1 id="t-'+k+'">'+TITLES[k]+'</h1></div><div id="b-'+k+'"></div></section>'});
  $("#app").innerHTML=h;
  document.querySelectorAll("[data-ic]").forEach(function(e){e.innerHTML=ico(e.dataset.ic)});
  $("#nav").classList.remove("hide");
}
function go(id){
  closeSheet();
  document.querySelectorAll(".v").forEach(function(v){v.classList.toggle("hide",v.id!=="v-"+id)});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.go===id)});
  window.scrollTo(0,0);R[id]();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(b){go(b.dataset.go);return}
  b=e.target.closest("[data-bk]");if(b){if(b.dataset.bk==="quiz"&&quizBack())return;go("home")}
});

/* الرئيسية */
function rHome(){
  $("#tiles").innerHTML=T.map(function(t){return '<button class="tile" data-go="'+t[0]+'"><div class="ic" style="background:'+t[3]+';color:'+t[4]+'">'+ico(t[2])+'</div>'+t[1]+'</button>'}).join("");
  var g=$("#grade");g.innerHTML=Object.keys(INFO.grades).map(function(k){return "<option"+(k===S.grade?" selected":"")+">"+esc(k)+"</option>"}).join("");
  g.style.display=REC?"none":"";g.onchange=function(){S.grade=g.value;save();rHome()};
  $("#hi").textContent="أهلاً بك"+(REC?" يا "+REC.n.split(" ")[0]:"")+" 👋";
  $("#news").innerHTML=INFO.news.map(function(n){return '<div class="card news"><b>📢 '+esc(n.title)+'</b>'+(n.text?'<p class="sub" style="line-height:1.8;white-space:pre-wrap">'+esc(n.text)+"</p>":"")+(n.image?'<img src="'+esc(n.image)+'" alt="" loading="lazy">':"")+"</div>"}).join("");
  var m=null;INFO.exams.forEach(function(e){var n=daysTo(e.d);if(n>=0&&(m===null||n<m))m=n});
  $("#s1").textContent=subs().length;$("#s2").textContent=m===null?"—":m;$("#s3").textContent=S.notes.length;
  $("#e1").innerHTML=ico("doc");$("#e2").innerHTML=ico("cal");$("#e3").innerHTML=ico("note");
  $("#tip").textContent=TIPS[new Date().getDate()%TIPS.length];
}

/* قائمة مع فلتر المادة */
function listWithChips(b,items,card,empty,bind){
  var subj=[],cur="";items.forEach(function(i){if(i.subject&&subj.indexOf(i.subject)<0)subj.push(i.subject)});
  function draw(){
    var l=items.filter(function(i){return !cur||i.subject===cur});
    b.innerHTML=(subj.length?'<div class="chips">'+[""].concat(subj).map(function(s){return '<button class="chip'+(s===cur?" on":"")+'" data-s="'+esc(s)+'">'+(esc(s)||"الكل")+"</button>"}).join("")+"</div>":"")+(l.length?l.map(card).join(""):'<div class="card">'+empty+"</div>");
    b.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){cur=c.dataset.s;draw()}});
    if(bind)bind(b,l);
  }
  draw();
}

/* ملازمي */
async function rFiles(){
  var b=$("#b-files");loading(b);var l;
  try{l=await jget("files?grade="+encodeURIComponent(S.grade))}catch(e){return errBox(b,rFiles)}
  listWithChips(b,l,function(x){
    var img=/^image/.test(x.type),c=/pdf/.test(x.type)?["#fde4e4","#d64545"]:img?["#dff2e4","#2e9e5b"]:["#e1e9f6","#2459a8"];
    return '<div class="card"><div class="fi"><div class="ic2" style="background:'+c[0]+";color:"+c[1]+'">'+ico(img?"books":"doc")+'</div><div class="t"><b>'+esc(x.title)+'</b><span class="sub">'+esc(x.subject)+(x.subject?" · ":"")+sz(x.size)+'</span></div></div><div class="acts"><a class="btn g" target="_blank" rel="noopener" href="/api/study/file/'+x.id+'">عرض</a><a class="btn" href="/api/study/file/'+x.id+'?dl=1">تحميل</a></div></div>'
  },"لا توجد ملازم لصفك حالياً، تابعنا قريباً 📚");
}

/* محاضراتي */
function embed(u){
  var m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/))return{t:"i",s:"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0"};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{t:"i",s:"https://drive.google.com/file/d/"+m[1]+"/preview"};
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:"v",s:u};
  return{t:"a",s:u};
}
async function rVideos(){
  var b=$("#b-videos");loading(b);var l;
  try{l=await jget("videos?grade="+encodeURIComponent(S.grade))}catch(e){return errBox(b,rVideos)}
  listWithChips(b,l,function(v,i){
    return '<div class="card vid" data-id="'+v.id+'"><div class="cover">'+(v.cover?'<img src="'+esc(v.cover)+'" alt="" loading="lazy">':ico("video"))+'</div><b>'+esc(v.title)+'</b><div class="sub">'+esc(v.subject)+"</div></div>"
  },"لا توجد محاضرات لصفك حالياً 🎬",function(bx,vis){
    bx.querySelectorAll(".vid").forEach(function(c){c.onclick=function(){
      var v=l.filter(function(x){return x.id===c.dataset.id})[0];if(!v)return;
      var e=embed(v.url),p=e.t==="i"?'<iframe src="'+esc(e.s)+'" allowfullscreen allow="fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>':e.t==="v"?'<video src="'+esc(e.s)+'" controls playsinline></video>':'<a class="btn" target="_blank" rel="noopener" href="'+esc(e.s)+'">فتح الفيديو</a>';
      sheet(p+'<h2 style="font-size:18px;margin:10px 0 4px">'+esc(v.title)+"</h2>"+(v.desc?'<p class="sub" style="line-height:1.8;white-space:pre-wrap">'+esc(v.desc)+"</p>":""));
    }});
  });
}

/* امتحاناتي: المواد ← الفصول ← سؤال واحد كل مرة */
var QZ={qs:null,sub:null,ch:null,i:0,sc:0};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
async function rQuiz(){
  var b=$("#b-quiz");
  if(!QZ.qs||!QZ.keep){QZ.sub=null;QZ.ch=null;loading(b);try{QZ.qs=await jget("questions?grade="+encodeURIComponent(S.grade))}catch(e){return errBox(b,rQuiz)}}
  QZ.keep=false;drawQuiz();
}
function drawQuiz(){
  var b=$("#b-quiz"),h="",qs=QZ.qs;$("#t-quiz").textContent=QZ.ch||QZ.sub||"امتحاناتي";
  if(!QZ.sub){
    h=subs().map(function(s,i){var n=qs.filter(function(q){return q.subject===s}).length;return '<button class="opt" data-s="'+i+'"><span>'+esc(s)+'</span><span class="sub">'+(n?ar(n)+" سؤال ":"")+"‹</span></button>"}).join("")||'<div class="card">لا توجد مواد.</div>';
  }else if(!QZ.ch){
    var chs=[];qs.forEach(function(q){if(q.subject===QZ.sub&&chs.indexOf(q.chapter)<0)chs.push(q.chapter)});
    h=chs.length?chs.map(function(c,i){var n=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===c}).length;return '<button class="opt" data-c="'+i+'"><span>'+esc(c)+'</span><span class="sub">'+ar(n)+" أسئلة ‹</span></button>"}).join(""):'<div class="card">لا توجد أسئلة لهذه المادة بعد.</div>';
    QZ.chs=chs;
  }else{
    var l=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===QZ.ch});
    if(QZ.i>=l.length){
      var pc=Math.round(QZ.sc/l.length*100);
      h='<div class="card" style="text-align:center"><div style="font-size:44px">'+(pc>=50?"🎉":"💪")+'</div><b style="font-size:22px">نتيجتك: '+QZ.sc+" من "+l.length+'</b><div class="sub" style="margin:6px 0 16px">'+pc+'%</div><div class="row"><button id="again">إعادة الأسئلة</button><button class="ghost" id="toCh">الفصول</button></div></div>';
    }else{
      var x=l[QZ.i];
      h='<div class="sub" style="margin-bottom:6px">السؤال '+(QZ.i+1)+" من "+l.length+'</div><div class="bar2"><i style="width:'+Math.round(QZ.i/l.length*100)+'%"></i></div><div class="card q"><b>'+esc(x.q)+"</b>"+shuf([[x.a,1]].concat(x.o.map(function(o){return[o,0]}))).map(function(c){return '<button class="ch" data-ok="'+c[1]+'">'+esc(c[0])+"</button>"}).join("")+'<div class="msg"></div></div><button id="nx" class="hide" style="width:100%;margin-top:4px">'+(QZ.i===l.length-1?"عرض النتيجة":"السؤال التالي")+"</button>";
    }
  }
  b.innerHTML=h;
  b.querySelectorAll("[data-s]").forEach(function(e){e.onclick=function(){QZ.sub=subs()[+e.dataset.s];QZ.ch=null;drawQuiz();window.scrollTo(0,0)}});
  b.querySelectorAll("[data-c]").forEach(function(e){e.onclick=function(){QZ.ch=QZ.chs[+e.dataset.c];QZ.i=0;QZ.sc=0;drawQuiz();window.scrollTo(0,0)}});
  var q=b.querySelector(".q");
  if(q)q.querySelectorAll(".ch").forEach(function(c){c.onclick=function(){
    if(q.classList.contains("done"))return;q.classList.add("done");
    var ok=c.dataset.ok==="1";if(ok)QZ.sc++;
    q.querySelectorAll(".ch").forEach(function(d){if(d.dataset.ok==="1")d.classList.add("good")});
    if(!ok)c.classList.add("bad");
    q.querySelector(".msg").textContent=ok?"✅ إجابة صحيحة":"❌ إجابة خاطئة، والجواب الصحيح مظلّل بالأخضر";
    $("#nx").classList.remove("hide");
  }});
  var nx=$("#nx");if(nx)nx.onclick=function(){QZ.i++;QZ.keep=true;drawQuiz();window.scrollTo(0,0)};
  var ag=$("#again");if(ag)ag.onclick=function(){QZ.i=0;QZ.sc=0;drawQuiz()};
  var tc=$("#toCh");if(tc)tc.onclick=function(){QZ.ch=null;drawQuiz()};
}
function quizBack(){if(QZ.ch){QZ.ch=null;drawQuiz();return true}if(QZ.sub){QZ.sub=null;drawQuiz();return true}return false}

/* نتيجتي + الغياب */
var curEx=0;
function loginCard(b,after){
  b.innerHTML='<div class="card"><b>🔐 أدخل رمزك الخاص</b><p class="sub">تدخله مرة واحدة فقط، وبعدها يُحفظ على جهازك.</p><div class="row" style="margin-top:10px"><input type="text" id="lc" inputmode="numeric" placeholder="الرمز الخاص بك" style="direction:ltr;text-align:center"><button id="lg">دخول</button></div><p class="err" id="le"></p></div>';
  async function ok(){
    var c=$("#lc").value.replace(/\D/g,"");if(!c)return;$("#lg").disabled=true;$("#le").textContent="";
    try{REC=await jpost("result",{code:c});S.me=c;S.grade=REC.g;save();after()}
    catch(e){$("#lg").disabled=false;$("#le").textContent=e===404?"الرمز غير صحيح، تأكد منه وحاول مرة ثانية.":e===429?"محاولات كثيرة، انتظر قليلاً ثم حاول.":"تعذر الاتصال، حاول مرة ثانية."}
  }
  $("#lg").onclick=ok;$("#lc").onkeydown=function(e){if(e.key==="Enter")ok()};
}
async function rRes(){
  var b=$("#b-res");
  if(S.me){try{REC=await jpost("result",{code:S.me});S.grade=REC.g;save()}catch(e){if(e===404){S.me="";REC=null;save()}}}
  if(!S.me||!REC){loginCard(b,rRes);return}
  var names=INFO.examNames,subjects=INFO.grades[REC.g]||[],mk=REC.x[curEx];
  var h='<div class="card hero"><h2>'+esc(REC.n)+"</h2><p>"+esc(REC.g)+' · <a href="#" id="o1">تبديل الحساب</a></p></div><div class="card"><select id="rEx">'+names.map(function(e,i){return '<option value="'+i+'"'+(i===curEx?" selected":"")+">"+esc(e)+"</option>"}).join("")+"</select></div>";
  if(!mk)h+='<div class="card">لا توجد نتيجة مسجّلة لهذا الامتحان بعد.</div>';
  else{
    var sum=0;h+='<div class="card">'+mk.map(function(v,i){sum+=v;return '<div class="ln"><span>'+esc(subjects[i]||"مادة "+(i+1))+"</span><b>"+ar(v)+"</b></div>"}).join("")+"</div>";
    var avg=(sum/mk.length).toFixed(1);h+='<div class="card" style="text-align:center"><b style="font-size:28px;color:var(--pri)">'+ar(avg)+'٪</b><div class="sub">المعدل · '+(avg>=50?"ناجح 🎉":"مكمل")+"</div></div>";
  }
  var ab=(REC.ab||[]).slice().sort().reverse();
  h+='<h2>الغياب</h2><div class="card">'+(ab.length?'<div class="sub" style="margin-bottom:6px">مجموع أيام الغياب: <b>'+ar(ab.length)+"</b></div>"+ab.map(function(d){return '<div class="ln"><span>'+DAYS[new Date(d+"T00:00:00").getDay()]+" · "+ar(d.split("-").reverse().join("/"))+"</span></div>"}).join(""):"لا يوجد غياب مسجّل، استمر هكذا 👏")+"</div>";
  b.innerHTML=h;
  $("#rEx").onchange=function(){curEx=+this.value;rRes()};
  $("#o1").onclick=function(e){e.preventDefault();S.me="";REC=null;save();rRes()};
}

/* ملاحظاتي (محفوظة على جهازك) */
var NE=null;
function rNotes(){
  var b=$("#b-notes");
  if(NE!==null){
    var n=S.notes.filter(function(x){return x.id===NE})[0]||{t:"",x:""};
    b.innerHTML='<div class="card"><input type="text" id="nt" placeholder="العنوان" value="'+esc(n.t)+'" style="margin-bottom:10px"><textarea id="nx2" placeholder="اكتب ملاحظتك هنا...">'+esc(n.x)+'</textarea><div class="row" style="margin-top:10px"><button id="ns">حفظ</button><button class="ghost" id="nc">إلغاء</button>'+(n.id?'<button class="ghost" id="nd" style="color:var(--red)">حذف</button>':"")+"</div></div>";
    $("#ns").onclick=function(){
      var t=$("#nt").value.trim(),x=$("#nx2").value.trim();if(!t&&!x)return;
      if(n.id){n.t=t;n.x=x;n.d=Date.now()}else S.notes.unshift({id:"n"+Date.now(),t:t,x:x,d:Date.now()});
      save();NE=null;rNotes();
    };
    $("#nc").onclick=function(){NE=null;rNotes()};
    var d=$("#nd");if(d)d.onclick=function(){S.notes=S.notes.filter(function(x){return x.id!==n.id});save();NE=null;rNotes()};
    return;
  }
  b.innerHTML='<div class="row" style="margin-bottom:12px"><input type="search" id="nq" placeholder="ابحث في ملاحظاتك..."><button id="na">+ جديدة</button></div><div id="nl"></div><p class="sub" style="text-align:center">الملاحظات محفوظة على جهازك فقط.</p>';
  function draw(){
    var q=$("#nq").value.trim().toLowerCase(),l=S.notes.filter(function(n){return !q||(n.t+" "+n.x).toLowerCase().indexOf(q)>-1});
    $("#nl").innerHTML=l.length?l.map(function(n){return '<div class="card" data-id="'+n.id+'" style="cursor:pointer"><b>'+esc(n.t||"بدون عنوان")+'</b><div class="sub" style="line-height:1.7;max-height:3.4em;overflow:hidden;white-space:pre-wrap">'+esc(n.x)+"</div></div>"}).join(""):'<div class="card">'+(S.notes.length?"لا نتائج مطابقة.":"ما عندك ملاحظات بعد، اضغط «جديدة» 📝")+"</div>";
    $("#nl").querySelectorAll("[data-id]").forEach(function(c){c.onclick=function(){NE=c.dataset.id;rNotes()}});
  }
  $("#nq").oninput=draw;$("#na").onclick=function(){NE="";rNotes()};draw();
}

/* المؤقّت */
var TM={mode:25,left:1500,total:1500,run:false,end:0,id:null,focus:true};
function drawT(){
  var mm=Math.floor(TM.left/60),ss=TM.left%60;$("#tm").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  $("#arc").setAttribute("stroke-dashoffset",(615.75*(1-TM.left/TM.total)).toFixed(1));
}
function setMode(m){
  clearInterval(TM.id);TM.run=false;TM.mode=m;TM.focus=m!==5;TM.left=TM.total=m*60;
  ["m25","m5","m50"].forEach(function(i){$("#"+i).classList.toggle("on",i==="m"+m)});$("#go").textContent="ابدأ";drawT();
}
function rTimer(){
  var b=$("#b-timer");
  if(!$("#tm")){
    b.innerHTML='<div class="card" style="text-align:center"><div class="seg"><button id="m25" class="on">تركيز ٢٥</button><button id="m5">استراحة ٥</button><button id="m50">تركيز ٥٠</button></div><div class="ring"><svg width="220" height="220"><circle cx="110" cy="110" r="98" fill="none" stroke="var(--pri2)" stroke-width="12"/><circle id="arc" cx="110" cy="110" r="98" fill="none" stroke="var(--pri)" stroke-width="12" stroke-linecap="round" stroke-dasharray="615.75" stroke-dashoffset="0"/></svg><div class="t" id="tm">25:00</div></div><div class="row"><button id="go">ابدأ</button><button id="rs" class="ghost">إعادة</button></div><p class="sub" id="tl" style="margin-top:12px"></p></div>';
    $("#m25").onclick=function(){setMode(25)};$("#m5").onclick=function(){setMode(5)};$("#m50").onclick=function(){setMode(50)};$("#rs").onclick=function(){setMode(TM.mode)};
    $("#go").onclick=function(){
      if(TM.run){clearInterval(TM.id);TM.run=false;$("#go").textContent="تابع";return}
      TM.run=true;TM.end=Date.now()+TM.left*1000;$("#go").textContent="إيقاف مؤقّت";
      TM.id=setInterval(function(){
        TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));drawT();
        if(TM.left===0){
          clearInterval(TM.id);TM.run=false;
          if(TM.focus){var k=new Date().toLocaleDateString("en-CA");S.log[k]=(S.log[k]||0)+TM.mode;save();showLog()}
          try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
          setMode(TM.focus?5:25);
        }
      },500);
    };
    setMode(25);
  }
  showLog();
}
function showLog(){var k=new Date().toLocaleDateString("en-CA"),e=$("#tl");if(e)e.textContent="دقائق المذاكرة اليوم: "+ar(S.log[k]||0)}

/* حاسبة المعدل */
function rCalc(){
  var b=$("#b-calc");
  b.innerHTML='<p class="sub" style="margin-bottom:10px">اكتب درجة كل مادة (من 0 إلى 100) ليُحسب معدلك.</p><div class="card">'+subs().map(function(s,i){return '<div class="ln"><span>'+esc(s)+'</span><input type="number" min="0" max="100" inputmode="decimal" data-i="'+i+'" style="width:90px;text-align:center"></div>'}).join("")+'</div><div class="card" style="text-align:center"><b id="av" style="font-size:30px;color:var(--pri)">—</b><div class="sub" id="avs"></div></div>';
  function calc(){
    var v=Array.from(b.querySelectorAll("input")).map(function(i){return i.value===""?null:Math.min(100,Math.max(0,+i.value))}).filter(function(x){return x!==null});
    if(!v.length){$("#av").textContent="—";$("#avs").textContent="";return}
    var a=v.reduce(function(x,y){return x+y},0)/v.length;$("#av").textContent=ar(a.toFixed(1))+"٪";$("#avs").textContent=(a>=50?"ناجح 🎉":"مكمل")+" · عدد المواد المحسوبة: "+ar(v.length);
  }
  b.querySelectorAll("input").forEach(function(i){i.oninput=calc});
}

/* مواعيد الامتحانات */
function rDates(){
  var b=$("#b-dates"),l=INFO.exams;
  b.innerHTML='<div class="card">'+(l.length?l.map(function(e){var n=daysTo(e.d),t=n>0?"بعد "+ar(n)+" يوم":n===0?"اليوم":"انتهى";return '<div class="ln"><div><b>'+esc(e.n)+'</b><div class="sub">'+DAYS[new Date(e.d+"T00:00:00").getDay()]+" · "+ar(e.d.split("-").reverse().join("/"))+'</div></div><span class="badge">'+t+"</span></div>"}).join(""):"لم تُضف مواعيد بعد.")+"</div>";
}

/* التشغيل */
async function boot(){
  try{INFO=await jget("info")}catch(e){$("#boot").innerHTML='تعذر الاتصال بالخادم.<br><button id="rb" style="margin-top:10px">إعادة المحاولة</button>';$("#rb").onclick=function(){location.reload()};return}
  if(S.me){try{REC=await jpost("result",{code:S.me});S.grade=REC.g}catch(e){if(e===404){S.me="";save()}}}
  var gs=Object.keys(INFO.grades);if(!INFO.grades[S.grade])S.grade=gs[0]||"";
  $("#boot").classList.add("hide");build();go("home");
}
boot();

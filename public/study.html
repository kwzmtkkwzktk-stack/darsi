<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة دليني العراقية | منصتك الدراسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#ffffff;--card:#fff;--tx:#14213d;--mut:#8a94a3;--pri:#2459a8;--pri2:#e6eefa;--red:#c8102e;--bd:#e6eaee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202b;--tx:#e8edf5;--mut:#93a0b3;--pri:#6aa6ff;--pri2:#1b2a40;--bd:#263244}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202b;--tx:#e8edf5;--mut:#93a0b3;--pri:#6aa6ff;--pri2:#1b2a40;--bd:#263244}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:0;font-weight:800}
h2{font-size:21px;margin:26px 0 14px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin:2px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 18px}
.top select{width:auto;max-width:56%;font-size:13px;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:22px 8px 18px;text-align:center;color:var(--tx);font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 18px rgba(20,33,61,.07)}
.tile:active{transform:scale(.97)}
.ic{width:58px;height:58px;border-radius:19px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}.ic svg{width:26px;height:26px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:18px 4px 14px;text-align:center;box-shadow:0 4px 18px rgba(20,33,61,.07)}
.st em{display:block;font-style:normal;height:22px}.st em svg{width:22px;height:22px;fill:currentColor}#e1{color:#2459a8}#e2{color:#2e9e5b}#e3{color:#e8a31c}
.st b{display:block;font-size:30px;margin:6px 0 2px;font-weight:800}
.st span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2e6fc7,#1b4a8f);color:#fff;border:0}
.hero h2{margin:0 0 4px}.hero p{margin:0;color:#dbe8fb}.hero a{color:#fff}
select,input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:700}
button.ghost{background:var(--pri2);color:var(--pri)}
button.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.back{background:var(--card);color:var(--tx);width:42px;height:42px;padding:0;font-size:20px;border:1px solid var(--bd)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border:0}
.badge{background:var(--pri2);color:var(--pri);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.bar2{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--pri)}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;background:var(--pri2);color:var(--pri)}.seg button.on{background:var(--pri);color:#fff}
.ring{position:relative;width:220px;height:220px;margin:8px auto}.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;direction:ltr}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}th,td{border:1px solid var(--bd);padding:8px 4px;text-align:center}th{background:var(--pri2);color:var(--pri)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;color:var(--tx);font-weight:700;font-size:16px;margin-bottom:10px;text-align:right}.qa{margin-top:10px;padding:10px 12px;background:var(--pri2);border-radius:12px;line-height:1.8;font-size:15px}.qa b{color:var(--pri)}
.ch{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:500;font-size:15px;line-height:1.7}.ch.good{background:rgba(46,158,91,.16);border-color:#2e9e5b}.ch.bad{background:rgba(214,69,69,.14);border-color:#d64545}.msg{margin-top:10px;font-size:14px;font-weight:700}
.hide{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mut);padding:8px 0;font-size:12px;border-radius:12px}
nav button i{display:block;margin:0 auto 2px;width:22px;height:22px;font-style:normal}nav button svg{width:22px;height:22px;fill:currentColor}nav button.on{color:var(--pri);background:var(--pri2)}

input[type=number],input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;min-height:140px;line-height:1.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fi{display:flex;gap:12px;align-items:center}
.ic2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ic2 svg{width:22px;height:22px;fill:currentColor}
.fi .t{flex:1;min-width:0}.fi .t b{display:block;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:10px}.acts a{flex:1}
a.btn{display:block;text-align:center;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;text-decoration:none}
a.btn.g{background:var(--pri2);color:var(--pri)}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}.ov.on{display:flex}
.sheet{background:var(--card);border-radius:22px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:14px}
.sheet iframe,.sheet video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;display:block;margin-bottom:10px}
.news img{width:100%;border-radius:14px;margin-top:8px;display:block}
.vid{cursor:pointer}.cover{width:100%;aspect-ratio:16/9;border-radius:14px;margin-bottom:10px;background:linear-gradient(135deg,#ebe5f7,#e1e9f6);display:grid;place-items:center;overflow:hidden;color:#7a4fd0}.cover img{width:100%;height:100%;object-fit:cover}.cover svg{width:44px;height:44px;fill:currentColor}
.site{font-size:13px;color:var(--pri);font-weight:700;text-decoration:none}
.lb{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;line-height:1.7}.chk input{width:20px;height:20px;accent-color:var(--pri);flex:0 0 auto}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:right;padding:16px 18px;background:linear-gradient(135deg,#2e6fc7,#1b4a8f);color:#fff;border:0}
.tile.wide .ic{margin:0;flex:0 0 auto}.tile.wide b{display:block;font-size:18px}.tile.wide small{display:block;font-weight:500;font-size:13px;opacity:.92;margin-top:2px}
.bub{display:flex;gap:10px;align-items:flex-start;background:var(--pri2);border-radius:18px;padding:14px;margin-bottom:12px;line-height:1.9}
.bot{font-size:30px;flex:0 0 auto}.bot.say{animation:pl .8s infinite}
.mic{width:84px;height:84px;border-radius:50%;font-size:34px;padding:0;background:var(--pri);color:#fff}.mic.on{background:#d64545;animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
.rs.ok{border-color:#2e9e5b;background:rgba(46,158,91,.12)}.rs.mid{border-color:#e8a31c;background:rgba(232,163,28,.14)}.rs.bad{border-color:#d64545;background:rgba(214,69,69,.1)}
.ans{padding:8px 10px;border-radius:10px;background:var(--card);margin:4px 0 8px;line-height:1.9}
mark{background:#ffe08a;color:#1c1c1c;border-radius:4px;padding:0 3px}
</style>
</head>
<body>
<div class="wrap">
  <div id="boot" class="card" style="margin-top:30px;text-align:center">جاري التحميل... إذا كان الموقع نايم قد يتأخر قليلاً ⏳</div>

<script>

var $=function(s){return document.querySelector(s)},esc=function(v){var d=document.createElement("div");d.textContent=v==null?"":v;return d.innerHTML};
var ar=function(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})};
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var TIPS=["ادرس أصعب مادة وقت ما يكون ذهنك صافي، غالباً الصبح.","قسّم الدرس إلى أجزاء صغيرة وخلّص جزء كل جلسة.","جرّب تشرح الدرس بصوت عالي كأنك تعلّم أحد، هذا يثبّت المعلومة.","سوّ أسئلة وزارية سنوات سابقة، هي أفضل تدريب للامتحان.","نام كافي، الدماغ يرتب المعلومات وانت نايم.","ابتعد عن الموبايل أثناء الجلسة، خلّه بغرفة ثانية.","راجع كل درس بعد يوم، وبعد أسبوع، وبعد شهر."];

S.notes=S.notes||[];S.log=S.log||{};S.me=S.me||"";S.grade=S.grade||"";

function closeSheet(){$("#ov").classList.remove("on");$("#sheet").innerHTML=""}
$("#ov").onclick=function(e){if(e.target===this)closeSheet()};

function build(){
  var h='<section id="v-home" class="v"><div class="top"><div><a class="site" href="/">→ منصة دليني العراقية</a><h1 id="hi" style="margin-top:4px">أهلاً بك 👋</h1></div><select id="grade" aria-label="الصف"></select></div><div id="news"></div><div class="grid" id="tiles"></div><h2>إحصائيات سريعة</h2><div class="stats"><div class="st"><em id="e3"></em><b id="s3">0</b><span>ملاحظاتي</span></div><div class="st"><em id="e2"></em><b id="s2">—</b><span>يوم متبقي</span></div><div class="st"><em id="e1"></em><b id="s1">0</b><span>مواد دراسية</span></div></div><div class="card" style="margin-top:14px"><b>💡 نصيحة اليوم</b><p id="tip" style="line-height:1.7;margin:6px 0 0"></p></div></section>';

function go(id){
  closeSheet();if(window.aiStop)aiStop();
  document.querySelectorAll(".v").forEach(function(v){v.classList.toggle("hide",v.id!=="v-"+id)});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.go===id)});
  window.scrollTo(0,0);R[id]();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(b){go(b.dataset.go);return}
  b=e.target.closest("[data-bk]");if(b){if(b.dataset.bk==="quiz"&&quizBack())return;go("home")}
});

/* قائمة مع فلتر المادة */
function listWithChips(b,items,card,empty,bind){
  var subj=[],cur="";items.forEach(function(i){if(i.subject&&subj.indexOf(i.subject)<0)subj.push(i.subject)});
  function draw(){
    var l=items.filter(function(i){return !cur||i.subject===cur});
    b.innerHTML=(subj.length?'<div class="chips">'+[""].concat(subj).map(function(s){return '<button class="chip'+(s===cur?" on":"")+'" data-s="'+esc(s)+'">'+(esc(s)||"الكل")+"</button>"}).join("")+"</div>":"")+(l.length?l.map(card).join(""):'<div class="card">'+empty+"</div>");
    b.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){cur=c.dataset.s;draw()}});
    if(bind)bind(b,l);
  }
  draw();
}

/* محاضراتي */
function embed(u){
  var m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/))return{t:"i",s:"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0"};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{t:"i",s:"https://drive.google.com/file/d/"+m[1]+"/preview"};
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:"v",s:u};
  return{t:"a",s:u};
}
async function rVideos(){
  var b=$("#b-videos");loading(b);var l;
  try{l=await jget("videos?grade="+encodeURIComponent(S.grade))}catch(e){return errBox(b,rVideos)}
  listWithChips(b,l,function(v,i){
    return '<div class="card vid" data-id="'+v.id+'"><div class="cover">'+(v.cover?'<img src="'+esc(v.cover)+'" alt="" loading="lazy">':ico("video"))+'</div><b>'+esc(v.title)+'</b><div class="sub">'+esc(v.subject)+"</div></div>"
  },"لا توجد محاضرات لصفك حالياً 🎬",function(bx,vis){
    bx.querySelectorAll(".vid").forEach(function(c){c.onclick=function(){
      var v=l.filter(function(x){return x.id===c.dataset.id})[0];if(!v)return;
      var e=embed(v.url),p=e.t==="i"?'<iframe src="'+esc(e.s)+'" allowfullscreen allow="fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>':e.t==="v"?'<video src="'+esc(e.s)+'" controls playsinline></video>':'<a class="btn" target="_blank" rel="noopener" href="'+esc(e.s)+'">فتح الفيديو</a>';
      sheet(p+'<h2 style="font-size:18px;margin:10px 0 4px">'+esc(v.title)+"</h2>"+(v.desc?'<p class="sub" style="line-height:1.8;white-space:pre-wrap">'+esc(v.desc)+"</p>":""));
    }});

/* امتحاناتي: المواد ← الفصول ← سؤال واحد كل مرة */
var QZ={qs:null,sub:null,ch:null,i:0,sc:0};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
async function rQuiz(){
  var b=$("#b-quiz");
  if(!QZ.qs||!QZ.keep){QZ.sub=null;QZ.ch=null;loading(b);try{QZ.qs=await jget("questions?grade="+encodeURIComponent(S.grade))}catch(e){return errBox(b,rQuiz)}}
  QZ.keep=false;drawQuiz();
}
function drawQuiz(){
  var b=$("#b-quiz"),h="",qs=QZ.qs;$("#t-quiz").textContent=QZ.ch||QZ.sub||"امتحاناتي";
  if(!QZ.sub){
    h=subs().map(function(s,i){var n=qs.filter(function(q){return q.subject===s}).length;return '<button class="opt" data-s="'+i+'"><span>'+esc(s)+'</span><span class="sub">'+(n?ar(n)+" سؤال ":"")+"‹</span></button>"}).join("")||'<div class="card">لا توجد مواد.</div>';
  }else if(!QZ.ch){
    var chs=[];qs.forEach(function(q){if(q.subject===QZ.sub&&chs.indexOf(q.chapter)<0)chs.push(q.chapter)});
    h=chs.length?chs.map(function(c,i){var n=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===c}).length;return '<button class="opt" data-c="'+i+'"><span>'+esc(c)+'</span><span class="sub">'+ar(n)+" أسئلة ‹</span></button>"}).join(""):'<div class="card">لا توجد أسئلة لهذه المادة بعد.</div>';
    QZ.chs=chs;
  }else{
    var l=qs.filter(function(q){return q.subject===QZ.sub&&q.chapter===QZ.ch});
    if(QZ.i>=l.length){
      var pc=Math.round(QZ.sc/l.length*100);
      h='<div class="card" style="text-align:center"><div style="font-size:44px">'+(pc>=50?"🎉":"💪")+'</div><b style="font-size:22px">نتيجتك: '+QZ.sc+" من "+l.length+'</b><div class="sub" style="margin:6px 0 16px">'+pc+'%</div><div class="row"><button id="again">إعادة الأسئلة</button><button class="ghost" id="toCh">الفصول</button></div></div>';
    }else{
      var x=l[QZ.i];
      h='<div class="sub" style="margin-bottom:6px">السؤال '+(QZ.i+1)+" من "+l.length+'</div><div class="bar2"><i style="width:'+Math.round(QZ.i/l.length*100)+'%"></i></div><div class="card q"><b>'+esc(x.q)+"</b>"+shuf([[x.a,1]].concat(x.o.map(function(o){return[o,0]}))).map(function(c){return '<button class="ch" data-ok="'+c[1]+'">'+esc(c[0])+"</button>"}).join("")+'<div class="msg"></div></div><button id="nx" class="hide" style="width:100%;margin-top:4px">'+(QZ.i===l.length-1?"عرض النتيجة":"السؤال التالي")+"</button>";
    }
  }
  b.innerHTML=h;
  b.querySelectorAll("[data-s]").forEach(function(e){e.onclick=function(){QZ.sub=subs()[+e.dataset.s];QZ.ch=null;drawQuiz();window.scrollTo(0,0)}});
  b.querySelectorAll("[data-c]").forEach(function(e){e.onclick=function(){QZ.ch=QZ.chs[+e.dataset.c];QZ.i=0;QZ.sc=0;drawQuiz();window.scrollTo(0,0)}});
  var q=b.querySelector(".q");
  if(q)q.querySelectorAll(".ch").forEach(function(c){c.onclick=function(){
    if(q.classList.contains("done"))return;q.classList.add("done");
    var ok=c.dataset.ok==="1";if(ok)QZ.sc++;
    q.querySelectorAll(".ch").forEach(function(d){if(d.dataset.ok==="1")d.classList.add("good")});
    if(!ok)c.classList.add("bad");
    q.querySelector(".msg").textContent=ok?"✅ إجابة صحيحة":"❌ إجابة خاطئة، والجواب الصحيح مظلّل بالأخضر";
    $("#nx").classList.remove("hide");
  }});
  var nx=$("#nx");if(nx)nx.onclick=function(){QZ.i++;QZ.keep=true;drawQuiz();window.scrollTo(0,0)};
  var ag=$("#again");if(ag)ag.onclick=function(){QZ.i=0;QZ.sc=0;drawQuiz()};
  var tc=$("#toCh");if(tc)tc.onclick=function(){QZ.ch=null;drawQuiz()};
}
function quizBack(){if(QZ.ch){QZ.ch=null;drawQuiz();return true}if(QZ.sub){QZ.sub=null;drawQuiz();return true}return false}

/* الامتحانات الورقية — أسئلة من الأدمن + تصحيح بالصورة */
var PAPER = { step: "pick", subject: "", questions: [], result: null, busy: false };

async function rPaper() {
  var b = $("#b-paper");
  PAPER.busy = false;
  if (PAPER.step === "pick" || !PAPER.subject) {
    drawPaperPick();
  } else if (PAPER.step === "exam") {
    drawPaperExam();
  } else if (PAPER.step === "result") {
    drawPaperResult();
  }
}

function drawPaperPick() {
  var b = $("#b-paper");
  var list = subs();
  var h = '<div class="card" style="margin-bottom:14px"><b>📝 الامتحانات الورقية</b><p class="sub" style="line-height:1.8;margin:8px 0 0">اختر المادة، تظهر لك الأسئلة اللي حضّرها المعلم. حلّها على ورقة، صوّر الورقة، وارفع الصورة ليصحّحها الذكاء الاصطناعي ويعطيك الدرجة والأخطاء.</p></div>';
  if (!list.length) {
    h += '<div class="card">اختر صفّك أولاً من الصفحة الرئيسية.</div>';
  } else {
    h += list.map(function(s, i) {
      return '<button class="opt" data-s="' + i + '"><span>' + esc(s) + '</span><span class="sub">‹</span></button>';
    }).join("");
  }
  b.innerHTML = h;
  b.querySelectorAll("[data-s]").forEach(function(btn) {
    btn.onclick = async function() {
      if (PAPER.busy) return;
      PAPER.busy = true;
      PAPER.subject = list[+btn.dataset.s];
      PAPER.questions = [];
      PAPER.result = null;
      loading(b);
      try {
        var r = await jpost("paper/generate", { grade: S.grade, subject: PAPER.subject });
        PAPER.questions = r.questions || [];
        PAPER.step = "exam";
        drawPaperExam();
      } catch (e) {
        PAPER.busy = false;
        PAPER.step = "pick";
        b.innerHTML = '<div class="card" style="text-align:center">لا يوجد امتحان لهذه المادة حالياً.<br><span class="sub">المعلم لم يضف أسئلة بعد، أو تأكد من الإنترنت وحاول مرة ثانية.</span><br><button id="rt" style="margin-top:12px">حاول مرة ثانية</button></div>';
        $("#rt").onclick = function() { PAPER.step = "pick"; rPaper(); };
      }
    };
  });
}

function drawPaperExam() {
  PAPER.busy = false;
  var b = $("#b-paper");
  var qs = PAPER.questions;
  var h = '<div class="card" style="margin-bottom:12px"><div class="sub">المادة</div><b style="font-size:18px">' + esc(PAPER.subject) + '</b><div class="sub" style="margin-top:6px">' + ar(qs.length) + ' أسئلة · حلّها على ورقة ثم صوّر إجابتك</div></div>';

  h += '<div class="card" style="margin-bottom:14px"><b>الأسئلة</b><ol style="padding-right:20px;line-height:2;margin:10px 0 0">';
  qs.forEach(function(q, i) {
    h += '<li style="margin-bottom:10px">' + esc(q) + '</li>';
  });
  h += '</ol></div>';

  h += '<div class="card"><b>📤 رفع صورة الإجابة</b><p class="sub" style="line-height:1.8;margin:8px 0 12px">صوّر الورقة كاملة وبوضوح، وتأكد أن الخط مقروء والضوء كويس.</p>';
  h += '<input type="file" id="pImg" accept="image/*" capture="environment" style="margin-bottom:12px">';
  h += '<div id="pPrev" class="hide" style="margin-bottom:12px"></div>';
  h += '<button id="pGrade" style="width:100%" disabled>صحّح الامتحان بالذكاء الاصطناعي</button>';
  h += '<button class="ghost" id="pBack" style="width:100%;margin-top:8px">رجوع واختيار مادة ثانية</button>';
  h += '</div>';

  b.innerHTML = h;

  var fileInput = $("#pImg");
  var gradeBtn = $("#pGrade");
  var preview = $("#pPrev");
  var selectedDataUrl = null;

  fileInput.onchange = function() {
    var f = fileInput.files && fileInput.files[0];
    if (!f) {
      selectedDataUrl = null;
      gradeBtn.disabled = true;
      preview.classList.add("hide");
      preview.innerHTML = "";
      return;
    }
    if (f.size > 6 * 1024 * 1024) {
      alert("الصورة كبيرة جداً. صوّر بجودة أقل أو قصّ الورقة.");
      fileInput.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function() {
      selectedDataUrl = reader.result;
      preview.classList.remove("hide");
      preview.innerHTML = '<img src="' + selectedDataUrl + '" alt="معاينة" style="width:100%;border-radius:14px;max-height:280px;object-fit:contain;background:#f0f0f0">';
      gradeBtn.disabled = false;
    };
    reader.readAsDataURL(f);
  };

  gradeBtn.onclick = async function() {
    if (!selectedDataUrl || PAPER.busy) return;
    PAPER.busy = true;
    gradeBtn.disabled = true;
    gradeBtn.textContent = "جاري التصحيح... قد يستغرق نصف دقيقة ⏳";
    try {
      var r = await jpost("paper/grade", {
        grade: S.grade,
        subject: PAPER.subject,
        questions: PAPER.questions,
        image: selectedDataUrl
      });
      PAPER.result = r;
      PAPER.step = "result";
      drawPaperResult();
    } catch (e) {
      PAPER.busy = false;
      gradeBtn.disabled = false;
      gradeBtn.textContent = "صحّح الامتحان بالذكاء الاصطناعي";
      alert("تعذر التصحيح. تأكد أن الصورة واضحة وأن الخدمة مفعّلة، ثم حاول مرة ثانية.");
    }
  };

  $("#pBack").onclick = function() {
    PAPER.step = "pick";
    PAPER.subject = "";
    PAPER.questions = [];
    PAPER.result = null;
    rPaper();
  };
}

function drawPaperResult() {
  var b = $("#b-paper");
  var r = PAPER.result || {};
  var pc = r.percent || 0;
  var emoji = pc >= 80 ? "🎉" : pc >= 50 ? "👍" : "💪";
  var h = '<div class="card" style="text-align:center;margin-bottom:14px">';
  h += '<div style="font-size:48px">' + emoji + '</div>';
  h += '<b style="font-size:24px">درجتك: ' + ar(r.score || 0) + ' من ' + ar(r.total || 10) + '</b>';
  h += '<div class="sub" style="margin:6px 0 0">' + ar(pc) + '%</div>';
  if (r.summary) h += '<p style="line-height:1.8;margin:14px 0 0">' + esc(r.summary) + '</p>';
  h += '</div>';

  if (r.details && r.details.length) {
    h += '<h2 style="margin:18px 0 10px">تفاصيل التصحيح</h2>';
    r.details.forEach(function(d) {
      var cls = d.ok ? "rs ok" : "rs bad";
      h += '<div class="card ' + cls + '" style="margin-bottom:10px">';
      h += '<b>السؤال ' + ar(d.n) + ' — ' + (d.ok ? "✅ صحيح" : "❌ خطأ") + '</b>';
      if (d.note) h += '<div class="sub" style="margin-top:6px;line-height:1.8">' + esc(d.note) + '</div>';
      h += '</div>';
    });
  }

  h += '<div class="row" style="margin-top:16px"><button id="pAgain">امتحان جديد</button><button class="ghost" id="pHome">الرئيسية</button></div>';
  b.innerHTML = h;
  PAPER.busy = false;

  $("#pAgain").onclick = function() {
    PAPER.step = "pick";
    PAPER.subject = "";
    PAPER.questions = [];
    PAPER.result = null;
    rPaper();
  };
  $("#pHome").onclick = function() { go("home"); };
}

/* ملاحظاتي (محفوظة على جهازك) */
var NE=null;
function rNotes(){
  var b=$("#b-notes");
  if(NE!==null){
    var n=S.notes.filter(function(x){return x.id===NE})[0]||{t:"",x:""};
    b.innerHTML='<div class="card"><input type="text" id="nt" placeholder="العنوان" value="'+esc(n.t)+'" style="margin-bottom:10px"><textarea id="nx2" placeholder="اكتب ملاحظتك هنا...">'+esc(n.x)+'</textarea><div class="row" style="margin-top:10px"><button id="ns">حفظ</button><button class="ghost" id="nc">إلغاء</button>'+(n.id?'<button class="ghost" id="nd" style="color:var(--red)">حذف</button>':"")+"</div></div>";
    $("#ns").onclick=function(){
      var t=$("#nt").value.trim(),x=$("#nx2").value.trim();if(!t&&!x)return;
      if(n.id){n.t=t;n.x=x;n.d=Date.now()}else S.notes.unshift({id:"n"+Date.now(),t:t,x:x,d:Date.now()});
      save();NE=null;rNotes();
    };
    $("#nc").onclick=function(){NE=null;rNotes()};
    var d=$("#nd");if(d)d.onclick=function(){S.notes=S.notes.filter(function(x){return x.id!==n.id});save();NE=null;rNotes()};

function drawT(){

  $("#arc").setAttribute("stroke-dashoffset",(615.75*(1-TM.left/TM.total)).toFixed(1));
}
function setMode(m){
  clearInterval(TM.id);TM.run=false;TM.mode=m;TM.focus=m!==5;TM.left=TM.total=m*60;
  ["m25","m5","m50"].forEach(function(i){$("#"+i).classList.toggle("on",i==="m"+m)});$("#go").textContent="ابدأ";drawT();
}
function rTimer(){

    b.innerHTML='<div class="card" style="text-align:center"><div class="seg"><button id="m25" class="on">تركيز ٢٥</button><button id="m5">استراحة ٥</button><button id="m50">تركيز ٥٠</button></div><div class="ring"><svg width="220" height="220"><circle cx="110" cy="110" r="98" fill="none" stroke="var(--pri2)" stroke-width="12"/><circle id="arc" cx="110" cy="110" r="98" fill="none" stroke="var(--pri)" stroke-width="12" stroke-linecap="round" stroke-dasharray="615.75" stroke-dashoffset="0"/></svg><div class="t" id="tm">25:00</div></div><div class="row"><button id="go">ابدأ</button><button id="rs" class="ghost">إعادة</button></div><p class="sub" id="tl" style="margin-top:12px"></p></div>';
    $("#m25").onclick=function(){setMode(25)};$("#m5").onclick=function(){setMode(5)};$("#m50").onclick=function(){setMode(50)};$("#rs").onclick=function(){setMode(TM.mode)};
    $("#go").onclick=function(){
      if(TM.run){clearInterval(TM.id);TM.run=false;$("#go").textContent="تابع";return}
      TM.run=true;TM.end=Date.now()+TM.left*1000;$("#go").textContent="إيقاف مؤقّت";
      TM.id=setInterval(function(){
        TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));drawT();
        if(TM.left===0){
          clearInterval(TM.id);TM.run=false;
          if(TM.focus){var k=new Date().toLocaleDateString("en-CA");S.log[k]=(S.log[k]||0)+TM.mode;save();showLog()}
          try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
          setMode(TM.focus?5:25);

    };

}

/* المساعد الذكي: يسأل بالصوت، يسمع إجابتك، ويصحّحها */
var AI={all:null,grade:"",qs:[],i:0,ok:0,mid:0,wrong:[],sound:true,auto:false,rec:null,ans:false,tok:0,view:"setup",err:""};
var SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
var TTS={ok:"speechSynthesis" in window,voice:null};
function pickVoice(){try{var v=speechSynthesis.getVoices();TTS.voice=v.filter(function(x){return /^ar([-_]|$)/i.test(x.lang)})[0]||null}catch(e){}}
if(TTS.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}

function say(text,cb){
  var tok=AI.tok;
  if(!TTS.ok||!AI.sound){if(cb)cb();return}
  try{speechSynthesis.cancel()}catch(e){}
  var parts=(String(text).match(/[^.؟?!\n]+[.؟?!\n]*/g)||[String(text)]).map(function(s){return s.trim()}).filter(Boolean),i=0,bt=$("#bot");
  if(bt)bt.classList.add("say");
  function done(){var b=$("#bot");if(b)b.classList.remove("say");if(cb&&tok===AI.tok)cb()}
  (function next(){
    if(i>=parts.length||tok!==AI.tok){done();return}
    var u=new SpeechSynthesisUtterance(parts[i++]);u.lang=TTS.voice?TTS.voice.lang:"ar-SA";if(TTS.voice)u.voice=TTS.voice;u.rate=.95;
    u.onend=next;u.onerror=done;
    try{speechSynthesis.speak(u)}catch(e){done()}
  })();
}
function stopMic(){if(AI.rec){var r=AI.rec;AI.rec=null;try{r.abort()}catch(e){}}var m=$("#aMic");if(m)m.classList.remove("on")}
function aiStop(){AI.tok++;try{speechSynthesis.cancel()}catch(e){}stopMic()}

/* فهم الإجابة: مقارنة الكلمات المهمة مع الجواب الصحيح */
var STOP={};"في من على الي عن هو هي ان التي الذي الذين ما هذا هذه ذلك تلك او ثم كل قد كان يكون تكون بين عند مع لا بعض اي كما حيث ذو هم هن لها له به بها فيها فيه منه منها ايضا اذا عندما".split(" ").forEach(function(w){STOP[w]=1});
function norm(s){return String(s||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase().replace(/[^\u0621-\u063A\u0641-\u064Aa-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function stem(w){
  w=w.replace(/^(وال|بال|كال|فال|لل|ال)/,"").replace(/^و(?=.{4,})/,"");
  var r=w.replace(/(ها|هم|هن|كم|ات|ون|ين|ان)$/,"");
  return r.length>=3?r:w;
}
function terms(s){var seen={},o=[];norm(s).split(" ").forEach(function(w){if(!w||STOP[w])return;w=stem(w);if(w.length>=2&&!seen[w]){seen[w]=1;o.push(w)}});return o}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function same(a,b){
  if(a===b)return true;if(a.length<3||b.length<3||a[0]!==b[0])return false;
  if(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0))return true;
  var mx=Math.max(a.length,b.length);return 1-lev(a,b)/mx>=(mx>=5?.75:.66);
}
var NEG={"غير":1,"ليس":1,"ليست":1,"لا":1,"ما":1,"بدون":1,"عدم":1,"لم":1,"لن":1,"دون":1};
function hasNeg(s){return norm(s).split(" ").some(function(w){return NEG[w]})}
function evaluate(ans,corr){
  var kt=terms(corr),st=terms(ans),hit=[],miss=[];
  kt.forEach(function(k){(st.some(function(s){return same(s,k)})?hit:miss).push(k)});
  var sc=kt.length&&st.length?hit.length/kt.length:0;
  if(sc>0&&hasNeg(corr)!==hasNeg(ans))sc*=.5; /* عكس المعنى (نفي/إثبات) */
  return{score:sc,missing:miss};
}
function markMissing(corr,miss){
  var words=[];
  var html=String(corr).split(/(\s+)/).map(function(w){var s=stem(norm(w).replace(/\s/g,""));if(s&&miss.indexOf(s)>-1){words.push(w.replace(/[.,،؟?!]/g,""));return "<mark>"+esc(w)+"</mark>"}return esc(w)}).join("");
  return{html:html,words:words};
}

/* الشاشة */
async function rAI(){
  var b=$("#b-ai");AI.view="setup";
  if(!AI.all||AI.grade!==S.grade){loading(b);try{AI.all=await jget("questions?grade="+encodeURIComponent(S.grade));AI.grade=S.grade}catch(e){return errBox(b,rAI)}}
  var subj=[];AI.all.forEach(function(q){if(subj.indexOf(q.subject)<0)subj.push(q.subject)});
  var inapp=/FBAN|FBAV|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent),notes=[];
  if(!TTS.ok)notes.push("متصفحك لا يدعم قراءة الأسئلة بالصوت.");
  if(!SRC)notes.push("الإجابة بالصوت غير مدعومة في متصفحك، لكن تقدر تكتب إجابتك.");
  if(inapp)notes.push("إذا لم يعمل المايك، افتح الرابط في متصفح Chrome بدل تطبيق فيسبوك.");
  b.innerHTML='<div class="bub"><div class="bot">🤖</div><div>أهلاً! أنا مساعدك الذكي. أسألك بصوتي، وتجاوبني بصوتك أو بالكتابة، وإذا أخطأت أصحّح لك الإجابة.</div></div>'+
    (AI.all.length?'<div class="card"><label class="lb">المادة</label><select id="aS"><option value="">كل المواد</option>'+subj.map(function(s){return "<option>"+esc(s)+"</option>"}).join("")+'</select><label class="lb">الفصل</label><select id="aC"></select><label class="lb">عدد الأسئلة</label><select id="aN"><option value="5">5 أسئلة</option><option value="10" selected>10 أسئلة</option><option value="0">كل الأسئلة</option></select>'+
      '<label class="chk"><input type="checkbox" id="aV" checked> 🔊 قراءة الأسئلة بصوت عالٍ</label>'+(SRC?'<label class="chk"><input type="checkbox" id="aA"> 💬 وضع المحادثة: يفتح المايك تلقائياً بعد كل سؤال</label>':"")+
      '<button id="aGo" style="width:100%;margin-top:14px">ابدأ الأسئلة 🎤</button>'+(notes.length?'<p class="sub" style="margin-top:10px;line-height:1.8">'+notes.map(esc).join("<br>")+"</p>":"")+"</div>":'<div class="card">لا توجد أسئلة لصفك بعد، تابعنا قريباً.</div>');
  if(!AI.all.length)return;
  function chap(){var s=$("#aS").value,c=[];AI.all.forEach(function(q){if((!s||q.subject===s)&&c.indexOf(q.chapter)<0)c.push(q.chapter)});$("#aC").innerHTML='<option value="">كل الفصول</option>'+c.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")}
  $("#aS").onchange=chap;chap();
  $("#aGo").onclick=function(){
    var s=$("#aS").value,c=$("#aC").value,n=+$("#aN").value;
    var l=shuf(AI.all.filter(function(q){return (!s||q.subject===s)&&(!c||q.chapter===c)}));if(n)l=l.slice(0,n);
    AI.sound=$("#aV").checked;AI.auto=!!($("#aA")&&$("#aA").checked&&SRC);AI.qs=l;AI.i=0;AI.ok=0;AI.mid=0;AI.wrong=[];drawQ();
  };
}
function drawQ(){
  AI.view="q";AI.ans=false;AI.tok++;stopMic();
  var b=$("#b-ai"),q=AI.qs[AI.i],tot=AI.qs.length;
  b.innerHTML='<div class="sub">السؤال '+(AI.i+1)+" من "+tot+'</div><div class="bar2"><i style="width:'+Math.round(AI.i/tot*100)+'%"></i></div>'+
    '<div class="bub"><div class="bot" id="bot">🤖</div><div><b>'+esc(q.q)+'</b><div class="sub">'+esc(q.subject)+" · "+esc(q.chapter)+"</div></div></div>"+
    '<div class="row" style="margin-bottom:10px"><button class="ghost" id="aRe">🔊 أعد السؤال</button><button class="ghost" id="aSk">تخطي ⏭</button></div>'+
    '<div class="card" id="aIn" style="text-align:center">'+(SRC?'<button class="mic" id="aMic" aria-label="تحدث">🎤</button><div class="sub" id="aLive" style="margin-top:8px;min-height:1.6em">اضغط المايك وجاوب بصوتك</div>':"")+
    '<textarea id="aTx" placeholder="أو اكتب إجابتك هنا..." style="min-height:80px;margin-top:10px"></textarea><button id="aSd" style="width:100%;margin-top:8px">إرسال الإجابة</button></div><div id="aRs"></div>';
  $("#aRe").onclick=function(){AI.tok++;say(q.q)};
  $("#aSk").onclick=function(){finish("",true)};
  $("#aSd").onclick=function(){var v=$("#aTx").value.trim();if(v)finish(v)};
  if($("#aMic"))$("#aMic").onclick=function(){if(AI.rec){var r=AI.rec;try{r.stop()}catch(e){}}else startMic()};
  say("السؤال "+(AI.i+1)+". "+q.q,function(){if(AI.auto&&SRC&&AI.view==="q"&&!AI.ans)startMic()});
}
function startMic(){
  if(!SRC||AI.rec||AI.ans)return;
  try{speechSynthesis.cancel()}catch(e){}
  var r=new SRC(),got="",tok=AI.tok;AI.err="";
  r.lang="ar-IQ";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=function(){var m=$("#aMic");if(m)m.classList.add("on");var l=$("#aLive");if(l)l.textContent="🎙 أسمعك... تكلّم"};
  r.onresult=function(e){var s="";for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;got=s;var l=$("#aLive");if(l)l.textContent="«"+s+"»";var x=$("#aTx");if(x)x.value=s};
  r.onerror=function(e){AI.err=e.error||"error"};
  r.onend=function(){
    if(AI.rec===r)AI.rec=null;var m=$("#aMic");if(m)m.classList.remove("on");
    if(tok!==AI.tok||AI.ans)return;
    if(got.trim()){finish(got.trim());return}
    var l=$("#aLive");if(l)l.textContent=/not-allowed|service-not-allowed/.test(AI.err)?"اسمح للمتصفح باستخدام المايك من إعدادات الموقع":AI.err==="network"?"الإنترنت ضعيف، حاول مرة ثانية":"ما سمعتك، اضغط المايك وحاول مرة ثانية";
  };
  AI.rec=r;try{r.start()}catch(e){AI.rec=null}
}
var PRAISE=["أحسنت! إجابتك صحيحة.","ممتاز، إجابة صحيحة.","عفية عليك! صح."];
function finish(text,skip){
  if(AI.ans)return;AI.ans=true;stopMic();
  var q=AI.qs[AI.i],ev=evaluate(text,q.a),v=skip?"bad":ev.score>=.65?"ok":ev.score>=.3?"mid":"bad";
  if(v==="ok")AI.ok++;else{AI.wrong.push(q);if(v==="mid")AI.mid++}
  var mk=markMissing(q.a,ev.missing),last=AI.i===AI.qs.length-1,h;
  if(v==="ok")h='<div class="card rs ok"><b>✅ إجابة صحيحة 🎉</b>'+(text?'<div class="ans">'+esc(text)+"</div>":"")+"</div>";
  else h='<div class="card rs '+v+'"><b>'+(skip?"⏭ تخطيت السؤال":v==="mid"?"⚠️ إجابتك قريبة لكنها ناقصة":"❌ إجابتك غير صحيحة")+"</b>"+(text?'<div class="sub" style="margin-top:8px">إجابتك:</div><div class="ans">'+esc(text)+"</div>":"")+'<div class="sub">الإجابة الصحيحة:</div><div class="ans">'+mk.html+"</div>"+(mk.words.length&&text?'<div class="sub">كلمات مهمة نقصت من إجابتك: <b>'+esc(mk.words.join("، "))+"</b></div>":"")+"</div>";
  $("#aRs").innerHTML=h+'<button id="aNx" style="width:100%">'+(last?"عرض النتيجة":"السؤال التالي")+"</button>";
  $("#aIn").classList.add("hide");$("#aRe").classList.add("hide");$("#aSk").classList.add("hide");
  function nx(){AI.i++;if(AI.i>=AI.qs.length)endAI();else drawQ();window.scrollTo(0,0)}
  $("#aNx").onclick=function(){AI.tok++;try{speechSynthesis.cancel()}catch(e){}nx()};
  var spoken=v==="ok"?PRAISE[Math.floor(Math.random()*PRAISE.length)]:(skip?"":v==="mid"?"إجابتك قريبة لكنها ناقصة. ":"إجابتك غير صحيحة. ")+"الإجابة الصحيحة هي: "+q.a;
  say(spoken,function(){if(AI.auto)setTimeout(function(){if(AI.view==="q"&&AI.qs[AI.i]===q)nx()},900)});
}
function endAI(){
  AI.view="end";AI.tok++;var b=$("#b-ai"),n=AI.qs.length,pc=Math.round(AI.ok/n*100);
  b.innerHTML='<div class="card" style="text-align:center"><div style="font-size:46px">'+(pc>=70?"🎉":pc>=50?"👍":"💪")+'</div><b style="font-size:22px">أجبت صح على '+AI.ok+" من "+n+'</b><div class="sub" style="margin:6px 0 14px">'+pc+"%"+(AI.mid?" · إجابات ناقصة: "+AI.mid:"")+'</div><div class="row">'+(AI.wrong.length?'<button id="aRt">أعد الأسئلة الخاطئة</button>':"")+'<button class="ghost" id="aNw">جلسة جديدة</button></div></div>'+
    (AI.wrong.length?'<h2>للمراجعة</h2>'+AI.wrong.map(function(q){return '<div class="card"><b>'+esc(q.q)+'</b><div class="ans">'+esc(q.a)+"</div></div>"}).join(""):"");
  if($("#aRt"))$("#aRt").onclick=function(){AI.qs=shuf(AI.wrong);AI.i=0;AI.ok=0;AI.mid=0;AI.wrong=[];drawQ()};
  $("#aNw").onclick=rAI;
  say("انتهت الجلسة. أجبت صح على "+AI.ok+" من "+n+(AI.wrong.length?". سأذكّرك بالأسئلة التي أخطأت بها لتراجعها.":". أحسنت!"));
}
